<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Live-Abstimmung – Seminar Heidelberg</title>
<style>
/* =========================================================
   Design-Tokens (Hell / Dunkel)
   ========================================================= */
:root{
  --bg:#f4f5fb; --surface:#ffffff; --surface-2:#eceef8; --text:#15172b; --muted:#565a78;
  --border:#dcdff0; --accent:#4c5ae6; --accent-text:#ffffff; --danger:#c42f3e; --success:#0f8a63;
  --shadow:0 6px 24px rgba(30,35,90,.08),0 1px 3px rgba(30,35,90,.06); --radius:18px;
  /* Datenfarben – im Hellmodus etwas dunkler für ausreichenden Kontrast */
  --c1:#4c5ae6; --c2:#e0463a; --c3:#0e9a70; --c4:#c27a00; --c5:#8c4fe6; --c6:#0d85b5; --c7:#d43a80; --c8:#4f7d10;
  font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#0e0f1f; --surface:#181a31; --surface-2:#232647; --text:#f1f2ff; --muted:#a9acd2;
  --border:#2e325e; --accent:#8590ff; --accent-text:#0e0f1f; --danger:#ff7a86; --success:#44d6a5;
  --shadow:0 8px 30px rgba(0,0,0,.45);
  --c1:#8590ff; --c2:#ff8a7c; --c3:#3fd6a6; --c4:#ffc04d; --c5:#b98bff; --c6:#4cc3f0; --c7:#ff7ab5; --c8:#a3d156;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- Bausteine ---------- */
.btn{display:inline-flex;align-items:center;gap:.4em;padding:.55em 1.05em;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:border-color .2s,background .2s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:transparent}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--surface-2)}
.btn.small{padding:.3em .75em;font-size:.88em}
.btn.block{width:100%;justify-content:center;padding:.9em;font-size:1.05em}
.btn[aria-pressed="true"]{background:var(--surface-2);border-color:var(--accent)}
.icon-btn{width:2.3em;height:2.3em;padding:0;justify-content:center}
.input{width:100%;padding:.6em .8em;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
textarea.input{resize:vertical}
.label{font-weight:700;font-size:.9em;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:.35em;margin-bottom:1em}
.row{display:flex;gap:.6em;flex-wrap:wrap;align-items:center}
.hint{font-size:.88em;color:var(--muted);margin:.3em 0}
.section-title{font-size:.75em;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;margin:0 0 .7em}
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.1em}
.pill{display:inline-flex;align-items:center;gap:.35em;white-space:nowrap;padding:.3em .85em;border-radius:999px;background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:.6em;font-weight:600;cursor:pointer;margin:.35em 0}
.check input{width:1.15em;height:1.15em;accent-color:var(--accent)}
fieldset.fs{border:0;padding:0;margin:0 0 1.2em}
fieldset.fs legend{padding:0;margin-bottom:.5em}
.brand{display:flex;align-items:center;gap:.5em;font-weight:800;font-size:1.15em;letter-spacing:-.01em;text-decoration:none;color:inherit}
.brand-dot{width:1.5em;height:1.5em;border-radius:50%;flex:none;background:conic-gradient(var(--c1) 0 25%,var(--c2) 0 50%,var(--c3) 0 75%,var(--c4) 0)}
.spacer{flex:1}
/* Logo: helle und dunkle Variante, passend zum Farbschema */
.logo{display:inline-flex;align-items:center;line-height:0}
.logo img{height:100%;width:auto;display:block}
.logo .logo-dark{display:none}
[data-theme="dark"] .logo .logo-light{display:none}
[data-theme="dark"] .logo .logo-dark{display:block}
.appbar .logo{height:54px}
.brand-sep{width:1px;height:1.6em;background:var(--border);margin:0 .2em}
.brand-name{font-weight:800;font-size:1.05em;color:var(--muted);letter-spacing:-.01em}
.toast{position:fixed;left:50%;bottom:1.4em;transform:translate(-50%,calc(100% + 2em));visibility:hidden;background:var(--text);color:var(--bg);padding:.7em 1.3em;border-radius:999px;font-weight:600;transition:transform .3s,visibility .3s;z-index:60;box-shadow:var(--shadow);max-width:90vw}
.toast.show{transform:translate(-50%,0);visibility:visible}

/* ---------- App-Leiste ---------- */
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1em;padding:.7em 1.4em;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav{display:flex;gap:.25em;flex-wrap:wrap}
.nav a{padding:.45em .95em;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* ---------- Editor ---------- */
.editor{display:grid;grid-template-columns:340px minmax(0,1fr);gap:1.4em;padding:1.4em;max-width:1500px;margin:0 auto}
.toolbar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.6em;align-items:center;background:var(--surface);padding:.75em 1em;border-radius:var(--radius);box-shadow:var(--shadow)}
.preview-banner{grid-column:1/-1;padding:.8em 1.1em;border-radius:14px;background:color-mix(in srgb,var(--c4) 16%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c4) 45%,transparent)}
.toolbar .title-input{flex:1 1 240px;font-weight:800;font-size:1.15em;border-color:transparent;background:transparent}
.toolbar .title-input:hover{border-color:var(--border)}
.codebox{display:flex;align-items:center;gap:.3em;padding:.2em .25em .2em .9em;border-radius:999px;background:var(--surface-2);font-weight:700;font-variant-numeric:tabular-nums}
.menu{position:relative}
.menu summary{list-style:none}
.menu summary::-webkit-details-marker{display:none}
.menu-list{position:absolute;right:0;top:calc(100% + .4em);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:.4em;display:flex;flex-direction:column;min-width:250px;z-index:30}
.menu-list .btn{justify-content:flex-start;border:0;border-radius:10px}
.menu-list hr{border:0;border-top:1px solid var(--border);margin:.3em 0}
.sidebar{display:flex;flex-direction:column;gap:1em;align-self:start;position:sticky;top:5em}
.qlist{list-style:none;margin:0 0 .9em;padding:0;display:flex;flex-direction:column;gap:.4em}
.qitem{display:flex;align-items:center;border-radius:12px;border:1.5px solid transparent;background:var(--surface-2);transition:border-color .2s}
.qitem.selected{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.qitem-main{flex:1;min-width:0;display:flex;align-items:center;gap:.55em;padding:.55em .6em;background:none;border:0;cursor:pointer;text-align:left;border-radius:10px}
.qnum{font-weight:800;color:var(--muted);min-width:1.2em;text-align:right;font-variant-numeric:tabular-nums}
.qtext{flex:1;min-width:0}
.qtitle{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.qsub{display:block;font-size:.8em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-badge{font-size:.68em;font-weight:800;background:#c42f3e;color:#fff;padding:.12em .55em;border-radius:999px;letter-spacing:.06em}
.qactions{display:flex;padding-right:.2em}
.qactions .btn{width:1.9em;height:1.9em;font-size:.85em}
.add-row select{flex:1}
.help ol{margin:0;padding-left:1.2em}
.help li{margin-bottom:.35em}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1.4em;align-items:start}
.optrow{display:flex;gap:.5em;align-items:center;margin-bottom:.45em}
.optrow .swatch{width:.9em;height:.9em;border-radius:50%;flex:none}
.optrow input[type=radio]{width:1.15em;height:1.15em;accent-color:var(--success);flex:none}
.form-actions{border-top:1px solid var(--border);padding-top:1em}
.preview-wrap{position:sticky;top:5em;display:flex;flex-direction:column;gap:.6em}
.preview{aspect-ratio:16/9;border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;container-type:inline-size;border:1px solid var(--border)}
.preview .slide{font-size:8px;font-size:1.4cqw}
@media (max-width:1320px){.workspace{grid-template-columns:1fr}.preview-wrap{position:static}}
@media (max-width:780px){.editor{grid-template-columns:1fr;padding:.8em}.sidebar{position:static}.appbar{padding:.6em .8em;flex-wrap:wrap}}

/* ---------- Folie (gemeinsam für Präsentation & Vorschau, alles in em) ---------- */
.slide{height:100%;display:flex;flex-direction:column;padding:2em 3em 1.4em;position:relative;background:var(--surface)}
.slide-head{margin-bottom:1.3em}
.slide-type{display:inline-flex;gap:.4em;align-items:center;font-size:.95em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.slide-title{font-size:2.6em;line-height:1.12;font-weight:800;letter-spacing:-.02em;margin:.2em 0 0;overflow-wrap:anywhere}
.viz{flex:1;min-height:0;position:relative}
/* Folie mit Bild: Bild links, Ergebnisse rechts */
.slide-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);grid-template-rows:minmax(0,1fr);gap:2.4em}
.slide-img{margin:0;min-height:0;display:flex;align-items:center;justify-content:center;animation:fadein .5s}
.slide-img img{width:100%;height:100%;object-fit:contain;display:block}
.slide-foot{display:flex;justify-content:space-between;align-items:center;gap:1em;margin-top:1em;font-size:1.1em;color:var(--muted);font-weight:600}
.empty-note{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:1.5em;font-weight:600;text-align:center;pointer-events:none}
.empty-slide{display:grid;place-items:center;color:var(--muted);font-size:1.6em}

/* Balken (Multiple Choice / Quiz-Auflösung) */
.bars{display:flex;align-items:stretch;justify-content:center;gap:2em;height:100%}
.bar-col{flex:1;max-width:10em;min-width:0;display:flex;flex-direction:column;align-items:center;transition:opacity .5s}
.bar-val{font-size:1.7em;font-weight:800;line-height:1.1;text-align:center;font-variant-numeric:tabular-nums}
.bar-val small{display:block;font-size:.5em;font-weight:600;color:var(--muted)}
.bar-track{flex:1;width:100%;display:flex;align-items:flex-end;margin-top:.4em;min-height:0}
.bar-fill{width:100%;height:0;min-height:.35em;border-radius:.6em .6em .2em .2em;transition:height .8s cubic-bezier(.2,.9,.25,1)}
.bar-label{margin-top:.6em;font-size:1.2em;font-weight:700;text-align:center;overflow-wrap:anywhere;line-height:1.2}
.bar-col.wrong{opacity:.32}
.bar-col.correct .bar-fill{box-shadow:0 0 0 .3em color-mix(in srgb,var(--success) 45%,transparent)}
.bar-col.correct .bar-label{color:var(--success)}

/* Quiz */
.quiz-run{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4em;height:100%}
.quiz-hint{font-size:1.3em;color:var(--muted);font-weight:600;margin:0}
.countdown{--p:1;width:7em;height:7em;flex:none;border-radius:50%;display:grid;place-items:center;margin:0 auto;background:conic-gradient(var(--accent) calc(var(--p) * 360deg),var(--surface-2) 0)}
.countdown span{width:80%;height:80%;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.countdown b{font-size:2.5em;font-weight:800;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1em;width:100%;max-width:62em}
.tile{display:flex;align-items:center;gap:.8em;padding:.9em 1.2em;border-radius:1em;background:var(--surface-2);font-size:1.4em;font-weight:700;border-left:.4em solid var(--tc);animation:fadein .4s both}
.shape{color:var(--tc);font-size:1.1em;line-height:1}

/* Wortwolke */
.cloud{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;align-items:center;gap:.15em .7em;height:100%;overflow:hidden;padding:0 1em}
.word{font-weight:800;line-height:1.1;letter-spacing:-.01em;transition:font-size .7s cubic-bezier(.2,.9,.25,1)}
.word.pop{animation:pop .55s both}

/* Skala */
.scale{display:flex;flex-direction:column;justify-content:center;height:100%;gap:1.1em;max-width:70em;margin:0 auto;width:100%}
.scale-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) 5.5em;gap:1.2em;align-items:center}
.scale-label{font-size:1.3em;font-weight:700;overflow-wrap:anywhere}
.scale-ends{display:flex;justify-content:space-between;font-size:1em;color:var(--muted);font-weight:600}
.scale-track{height:1.1em;background:var(--surface-2);border-radius:1em;position:relative}
.scale-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:1em;opacity:.35;transition:width .8s cubic-bezier(.2,.9,.25,1)}
.scale-dot{position:absolute;top:50%;left:0;width:1.7em;height:1.7em;border-radius:50%;transform:translate(-50%,-50%);border:.25em solid var(--surface);box-shadow:var(--shadow);opacity:0;transition:left .8s cubic-bezier(.2,.9,.25,1),opacity .4s}
.scale-val{font-size:1.6em;font-weight:800;font-variant-numeric:tabular-nums}
.scale-val small{font-size:.55em;color:var(--muted);font-weight:600}

/* Offene Antworten */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(15em,1fr));gap:1em;align-content:start;height:100%;overflow:auto;padding:.3em}
.card-ans{background:var(--surface-2);border-radius:1em;padding:1em 1.2em;font-size:1.2em;font-weight:600;border-top:.35em solid var(--tc);overflow-wrap:anywhere;animation:flyin .6s cubic-bezier(.2,.9,.25,1) both}

/* Ranking */
.rank-list{--rh:3.7em;position:relative;max-width:70em;margin:0 auto;width:100%}
.rank-row{position:absolute;left:0;right:0;top:0;height:calc(var(--rh) - .6em);display:grid;grid-template-columns:2.4em minmax(0,1.2fr) minmax(0,2fr) 5em;gap:1em;align-items:center;transition:top .7s cubic-bezier(.2,.9,.25,1)}
.rank-pos{font-size:1.6em;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.rank-label{font-size:1.3em;font-weight:700;overflow-wrap:anywhere}
.rank-track{height:1.2em;border-radius:1em;background:var(--surface-2);overflow:hidden}
.rank-fill{height:100%;width:0;border-radius:1em;transition:width .8s cubic-bezier(.2,.9,.25,1)}
.rank-score{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

/* Verborgene Ergebnisse */
.hidden-res{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hidden-res .big{font-size:5em;line-height:1}
.hidden-res p{font-size:1.6em;font-weight:700;margin:.4em 0 0}
.hidden-res .hint{font-size:1.2em}

/* ---------- Präsentation ---------- */
.present{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--surface)}
.joinbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.1em;padding:.6em 1.5em;background:var(--surface-2);font-size:clamp(13px,1.05vw,22px)}
.joinbar .logo{height:5.4em;justify-self:start}
.join-center{display:flex;align-items:center;gap:1.1em;min-width:0}
.joinbar .pill{justify-self:end}
@media (max-width:900px){.joinbar{grid-template-columns:1fr}.joinbar .logo,.joinbar .pill{justify-self:center}}
.join-text{display:flex;align-items:baseline;gap:.4em;flex-wrap:wrap;justify-content:center;min-width:0}
.joinbar .url{max-width:28em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.joinbar .code{font-weight:800;font-size:1.6em;letter-spacing:.08em;color:var(--accent);font-variant-numeric:tabular-nums}
.qr-btn{background:#fff;border:0;border-radius:.5em;padding:.15em;cursor:zoom-in;line-height:0}
.qr-btn svg{width:5.4em;height:5.4em}
.present-main{flex:1;min-height:0}
.present .slide{font-size:clamp(10px,min(1.25vw,2.2vh),30px)}
.controls{display:flex;flex-wrap:wrap;gap:.45em;justify-content:center;align-items:center;padding:.6em 1em;border-top:1px solid var(--border);transition:opacity .4s;font-size:.95em}
.present.idle .controls{opacity:0}
.present.idle{cursor:none}
.counter{font-weight:800;min-width:4.5em;text-align:center;font-variant-numeric:tabular-nums}
.sep{width:1px;height:1.6em;background:var(--border);margin:0 .3em}
.overlay{position:fixed;inset:0;background:rgba(10,12,30,.72);display:grid;place-items:center;z-index:50;padding:2em;animation:fadein .2s}
.overlay-card{background:#fff;color:#111;border-radius:24px;padding:1.6em;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.6em}
.overlay-card svg{width:min(70vw,62vh);height:auto;display:block}
.overlay-code{font-size:1.6em;margin:0}
/* Beitrittsansicht zu Beginn der Präsentation */
.join-screen{max-width:96vw;max-height:96vh;overflow:auto;padding:2em 2.6em}
.join-screen h2{margin:0;font-size:clamp(1.6rem,3.4vw,3rem);letter-spacing:-.02em}
.join-grid{display:flex;align-items:center;gap:clamp(1.5rem,4vw,4rem);flex-wrap:wrap;justify-content:center}
.join-screen svg{width:min(62vh,46vw);min-width:260px}
.join-steps{text-align:left;font-size:clamp(1rem,1.8vw,1.6rem);max-width:22em}
.join-steps ol{margin:.4em 0 0;padding-left:1.2em}
.join-steps li{margin:.5em 0}
.join-steps .big-code{display:block;font-size:2.2em;font-weight:800;letter-spacing:.08em;color:#3b47c9;font-variant-numeric:tabular-nums}
.join-steps .join-url{font-weight:700;overflow-wrap:anywhere}
.join-warn{max-width:46em;background:#fff4dc;color:#6b4300;border:1.5px solid #f0c060;border-radius:12px;padding:.7em 1em;text-align:left;font-size:.95rem}
.join-screen .btn.primary{background:#3b47c9;color:#fff;border-color:transparent;font-size:1.15rem;padding:.7em 1.6em}
.overlay-card .btn{background:#fff;color:#111;border-color:#ccc}

/* ---------- Teilnehmer ---------- */
.vote{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.vote-head{display:flex;align-items:center;gap:.5em;padding:.7em 1em;border-bottom:1px solid var(--border);background:var(--surface)}
.vote-main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:1.4em 1.1em 3em}
.vote h1{font-size:1.6em;line-height:1.2;margin:.15em 0 1em;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.q-kicker{margin:0;font-size:.8em;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.choice{display:flex;align-items:center;gap:.8em;width:100%;padding:1em 1.1em;margin-bottom:.6em;border-radius:14px;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;text-align:left;transition:border-color .2s,background .2s,transform .1s}
.choice:hover{border-color:var(--tc,var(--accent))}
.choice:active{transform:scale(.98)}
.choice:has(input:checked){border-color:var(--tc,var(--accent));background:color-mix(in srgb,var(--tc,var(--accent)) 12%,var(--surface))}
.choice input{accent-color:var(--tc,var(--accent));width:1.25em;height:1.25em;flex:none}
fieldset.plain{border:0;padding:0;margin:0}
.join-card{text-align:center;margin-top:7vh}
.join-card .logo{width:100%;max-width:340px;margin:0 auto 1.6em}
.join-card .logo img{width:100%;height:auto}
.vote-head .logo{height:36px}
.code-input{font-size:2em;text-align:center;letter-spacing:.18em;font-weight:800;margin:.6em 0 0;font-variant-numeric:tabular-nums}
.error{color:var(--danger);font-weight:600;min-height:1.4em;margin:.5em 0}
.thanks{text-align:center;margin-top:8vh;animation:fadein .4s}
.thanks .big{font-size:4.5em;line-height:1;animation:pop .6s both}
.thanks h2{margin:.4em 0 .2em;font-size:1.5em}
.rate-fs{border:0;padding:0;margin:0 0 1.4em}
.rate-fs legend{font-weight:700;margin-bottom:.5em;padding:0}
.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:.4em}
.rating label{position:relative;display:grid;place-items:center;padding:.7em 0;border-radius:12px;border:2px solid var(--border);background:var(--surface);font-weight:800;cursor:pointer;transition:all .2s}
.rating input{position:absolute;opacity:0;inset:0;cursor:pointer}
.rating label:has(input:checked){background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.rating label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.rate-ends{display:flex;justify-content:space-between;font-size:.8em;color:var(--muted);margin-top:.3em}
.rank-vote{list-style:none;padding:0;margin:0 0 1em}
.rank-item{display:flex;align-items:center;gap:.6em;padding:.55em .5em .55em .9em;border-radius:12px;background:var(--surface);border:2px solid var(--border);border-left:.4em solid var(--tc);margin-bottom:.5em;cursor:grab;animation:fadein .25s}
.rank-item.dragging{opacity:.45}
.rank-num{font-weight:800;color:var(--muted);min-width:1.3em}
.rank-text{flex:1;font-weight:600;overflow-wrap:anywhere}
.quiz-vote .countdown{font-size:13px;margin-bottom:1.2em}
.quiz-grid{display:grid;gap:.6em}
.quiz-choice{font-size:1.1em;padding:1.1em;border-left:.4em solid var(--tc)}
.char-count{text-align:right}
.vote-img{display:block;width:100%;max-height:38vh;object-fit:contain;border-radius:14px;margin:-.3em 0 1.3em}
/* Bild-Upload im Editor */
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;padding:1.3em 1em;border:2px dashed var(--border);border-radius:14px;background:var(--surface-2);text-align:center;cursor:pointer;color:var(--muted);font-weight:600;transition:border-color .2s,background .2s}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.dropzone:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.dropzone .big{font-size:1.8em;line-height:1}
.dropzone input{position:absolute;width:1px;height:1px;opacity:0}
.img-edit{display:grid;grid-template-columns:140px minmax(0,1fr);gap:.8em;align-items:start}
.img-edit img{width:140px;height:100px;object-fit:cover;border-radius:10px;border:1px solid var(--border);background:var(--surface-2)}
.img-edit .row{margin-top:.5em}
/* Datei-Anhänge */
.file-list{list-style:none;margin:0 0 .6em;padding:0}
.file-list li{display:flex;align-items:center;gap:.5em;padding:.4em .2em;border-bottom:1px solid var(--border)}
.file-list .hint{margin:0;white-space:nowrap}
.link-btn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-align:left;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline;text-underline-offset:2px}
.dropzone.compact{flex-direction:row;padding:.8em 1em;gap:.6em}
.dropzone.compact .big{font-size:1.3em}
.file-size{font-weight:500;color:var(--muted);margin-left:.35em;font-size:.88em}
.foot-left{display:flex;align-items:center;gap:.8em;flex-wrap:wrap;min-width:0}
.slide-files{display:flex;gap:.4em;flex-wrap:wrap}
.slide-files .btn{font-size:.85em}
.vote-files{margin:0 0 1.3em;display:flex;flex-direction:column;gap:.45em}
.vote-files .label{margin:0}
.vote-files .btn{white-space:normal;text-align:left;justify-content:flex-start;padding:.6em .9em}
.thanks + .vote-files{margin-top:2.2em}
/* PDF als Folieninhalt */
.slide-body.pdf{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.slide-img .pdf-frame{width:100%;height:100%}
.pdf-frame{display:block;width:100%;border:0;border-radius:1em;background:#fff;box-shadow:var(--shadow)}
.pdf-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em;padding:1.4em;border-radius:14px;background:var(--surface);border:2px solid var(--border);text-align:center;width:100%;height:100%}
.pdf-card .big{font-size:2.6em;line-height:1}
.pdf-card p{margin:0;font-weight:700;overflow-wrap:anywhere}
.pdf-thumb{width:140px;height:100px;display:grid;place-items:center;font-size:2.6em;border-radius:10px;border:1px solid var(--border);background:var(--surface-2)}
.media-name{font-weight:700;overflow-wrap:anywhere}
.vote-pdf{margin:-.3em 0 1.3em}
.vote-pdf .pdf-frame{height:58vh;border-radius:14px}
.vote-pdf .pdf-card{height:auto}
.pdf-actions{display:flex;gap:.5em;flex-wrap:wrap;margin-top:.6em}
.overlay-pdf{width:min(96vw,1400px);height:92vh;background:var(--surface);color:var(--text);border-radius:20px;padding:1em;display:flex;flex-direction:column;gap:.7em}
.overlay-pdf .row{justify-content:space-between}
.overlay-pdf .pdf-frame{flex:1;height:auto;border-radius:12px;box-shadow:none;border:1px solid var(--border)}

@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes flyin{from{transform:translateY(1.6em) scale(.9) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

/* ---------- Speicher mit Fallback ----------
   In eingeschränkten Umgebungen (z. B. Datei-Vorschau in einem gesperrten iframe)
   ist localStorage evtl. nicht verfügbar. Dann läuft das Tool im Arbeitsspeicher
   weiter (ohne Synchronisation zwischen Tabs), statt gar nicht zu starten. */
function safeStorage(kind) {
  try {
    const st = window[kind], k = '__mentiLite_test';
    st.setItem(k, '1'); st.removeItem(k);
    return { store: st, persistent: true };
  } catch {
    const m = new Map();
    return {
      persistent: false,
      store: {
        getItem: k => (m.has(k) ? m.get(k) : null),
        setItem: (k, v) => { m.set(String(k), String(v)); },
        removeItem: k => { m.delete(k); },
        key: i => [...m.keys()][i] ?? null,
        get length() { return m.size; },
      },
    };
  }
}
const _ls = safeStorage('localStorage'), _ss = safeStorage('sessionStorage');
const LS = _ls.store, SS = _ss.store;
/** true, wenn das Tool nicht als normale Datei/Webseite im Browser läuft (z. B. in einer Vorschau). */
const IN_PREVIEW = !_ls.persistent || !/^(https?|file):$/.test(location.protocol) || (() => { try { return window.top !== window.self; } catch { return true; } })();

   MentiLite – Live-Abstimmungstool in einer einzigen Datei
   Aufbau:
     1. Hilfsfunktionen (DOM, Text, Download)
     2. Fragetypen, Validierung, Auswertung
     3. store – gesamte Datenlogik (austauschbar gegen ein Backend)
     4. QR-Code-Generator (ohne externe Bibliothek)
     5. Visualisierungen der Folien
     6. Ansichten: Editor (#edit), Präsentation (#present), Teilnehmer (#vote)
     7. Router & Theme

   eingefügt (Hilfsfunktion h), niemals über innerHTML.
   ========================================================= */

/* ==================== 1. Hilfsfunktionen ==================== */

/** Erzeugt DOM-Elemente sicher. Kinder-Strings werden als Text-Knoten eingefügt (XSS-sicher). */
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') {
        for (const [sk, sv] of Object.entries(v)) {
          if (sk.startsWith('--')) el.style.setProperty(sk, sv); else el.style[sk] = sv;
        }
      } else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;

const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
/** Bereinigt Nutzertext: Steuerzeichen raus, Leerraum normalisieren, Länge begrenzen. */
const clean = (s, max) => String(s ?? '').replace(/[\u0000-\u001F\u007F]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max);
const clampInt = (v, min, max, def) => { const n = parseInt(v, 10); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def; };
const color = i => `var(--c${(((i % 8) + 8) % 8) + 1})`;
const SHAPES = ['▲', '◆', '●', '■', '★', '⬟', '⬢', '✚'];
const newCode = () => String(100000 + Math.floor(Math.random() * 900000));
const fmtCode = c => String(c).replace(/^(\d{3})(\d{3})$/, '$1 $2');
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const numDE = (n, d = 1) => n.toFixed(d).replace('.', ',');
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const strHash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const baseUrl = () => location.href.split('#')[0];
/** Adresse, unter der Teilnehmende das Tool erreichen (im Editor einstellbar), sonst die aktuelle Adresse. */
const joinBaseUrl = () => store.getState().joinBase || baseUrl();
const joinUrl = code => `${joinBaseUrl()}#vote/${code}`;
/** true, wenn ein Handy diese Adresse nicht öffnen kann (lokale Datei, localhost, Vorschau …). */
const isLocalUrl = u => !/^https?:\/\//i.test(u) || /^https?:\/\/(localhost|127\.|0\.0\.0\.0|\[::1\])/i.test(u);
/** Prüft eine eingegebene Teilnahme-Adresse; gibt die bereinigte Adresse oder '' zurück. */
function cleanJoinBase(u) {
  u = String(u || '').trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { const x = new URL(u); if (!/^https?:$/.test(x.protocol)) return ''; x.hash = ''; return x.href.slice(0, 300); } catch { return ''; }
}
const isTyping = e => { const t = e.target; return !!t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)); };
const slugify = t => String(t).toLowerCase().replace(/[äöüß]/g, m => ({ ä: 'ae', ö: 'oe', ü: 'ue', ß: 'ss' }[m]))
  .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'praesentation';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2600);
}
function download(name, text, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/**
 * Liest ein hochgeladenes Bild, verkleinert es (max. 1600×1200) und kodiert es neu
 * als WebP (Fallback JPEG). Durch das Neu-Kodieren über <canvas> werden auch
 * Metadaten (z. B. GPS-Daten aus Handyfotos) entfernt. Ziel: < ca. 450 KB pro Bild,
 * damit mehrere Bilder in den localStorage (ca. 5 MB) passen.
 */
async function compressImage(file, maxW = 1600, maxH = 1200, maxLen = 450000) {
  if (!file || !/^image\/(png|jpe?g|webp|gif|bmp|avif)$/i.test(file.type)) throw new Error('Bitte eine Bilddatei wählen (JPG, PNG, WebP oder GIF).');
  if (file.size > 20e6) throw new Error('Die Datei ist zu groß (max. 20 MB).');
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { throw new Error('Das Bild konnte nicht gelesen werden.'); }
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
  const webp = canvas.toDataURL('image/webp').startsWith('data:image/webp');
  let scale = Math.min(1, maxW / bmp.width, maxH / bmp.height), quality = 0.85;
  try {
    for (let attempt = 0; attempt < 7; attempt++) {
      canvas.width = Math.max(1, Math.round(bmp.width * scale));
      canvas.height = Math.max(1, Math.round(bmp.height * scale));
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!webp) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); } // JPEG kennt keine Transparenz
      ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
      const url = canvas.toDataURL(webp ? 'image/webp' : 'image/jpeg', quality);
      if (url.length <= maxLen) return url;
      if (quality > 0.65) quality -= 0.1; else scale *= 0.75;
    }
  } finally { bmp.close?.(); }
  throw new Error('Das Bild lässt sich nicht klein genug komprimieren.');
}
const IMAGE_RE = /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/]+=*$/;
const imageKey = q => (q.image ? `${q.image.length}:${q.image.slice(-24)}:${q.imageAlt}` : '') + (q.pdf ? `|pdf:${q.pdf.id}` : '');

/* ---------- Datei-Anhänge ----------
   Bis zu 3 Dateien (je max. 2 MB) pro Frage, z. B. Arbeitsblätter als PDF.
   Der Inhalt liegt in einem eigenen localStorage-Schlüssel pro Datei; in der Frage
   stehen nur Metadaten. So bleiben Abstimmungen schnell, auch mit großen Anhängen. */
const FILE_EXT = ['pdf', 'doc', 'docx', 'odt', 'rtf', 'txt', 'ppt', 'pptx', 'odp', 'xls', 'xlsx', 'ods', 'csv', 'zip', 'png', 'jpg', 'jpeg', 'gif', 'webp', 'mp3', 'm4a'];
const MAX_FILE = 2 * 1024 * 1024, MAX_FILES = 3;
const fmtBytes = b => (b < 1024 ? `${b} B` : b < 1048576 ? `${Math.round(b / 1024)} KB` : `${(b / 1048576).toFixed(1).replace('.', ',')} MB`);
const isDataUrl = d => typeof d === 'string' && d.length < 4e6 && /^data:[\w.+-]+\/[\w.+-]+;base64,[A-Za-z0-9+/]*={0,2}$/.test(d);
const filesKey = q => (q.files || []).map(f => f.id).join(',');

/** Prüft die Metadaten eines Anhangs. */
function normFile(a) {
  if (!a || typeof a !== 'object' || typeof a.id !== 'string' || !/^f-\w{4,40}$/.test(a.id)) return null;
  const type = /^[\w.+-]+\/[\w.+-]+$/.test(String(a.type || '')) ? a.type : 'application/octet-stream';
  return { id: a.id, name: clean(a.name, 120) || 'Datei', type, size: clampInt(a.size, 0, 1e8, 0) };
}
function readAsDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('Datei konnte nicht gelesen werden.'));
    r.readAsDataURL(file);
  });
}
async function processFile(file) {
  const ext = (file.name.includes('.') ? file.name.split('.').pop() : '').toLowerCase();
  if (!FILE_EXT.includes(ext)) throw new Error(`Dateityp „${ext ? '.' + ext : 'ohne Endung'}“ wird nicht unterstützt.`);
  if (file.size > MAX_FILE) throw new Error(`Die Datei ist zu groß (max. ${fmtBytes(MAX_FILE)}).`);
  const d = await readAsDataURL(file);
  if (!isDataUrl(d)) throw new Error('Datei konnte nicht gelesen werden.');
  return d;
}
/** Download über eine Blob-URL – Dateien werden nie als Seite geöffnet oder ausgeführt. */
function dataUrlToBlob(d, type) {
  const bin = atob(d.slice(d.indexOf(',') + 1)), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type });
}
function downloadAttachment(meta) {
  const d = store.getFile(meta.id);
  if (!isDataUrl(d)) { toast('Diese Datei ist nicht mehr verfügbar.'); return; }
  const url = URL.createObjectURL(dataUrlToBlob(d, meta.type || 'application/octet-stream'));
  const a = h('a', { href: url, download: meta.name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
/* ---------- PDF als Folieninhalt ----------
   Eine PDF (max. 2 MB) kann statt eines Bildes neben den Ergebnissen angezeigt werden.
   Anzeige über den eingebauten PDF-Viewer des Browsers – ohne externe Bibliothek.
   Browser ohne eingebauten Viewer (z. B. Chrome auf Android) zeigen stattdessen
   eine Karte mit „PDF öffnen“ und „Herunterladen“. */
const MAX_PDF = 2 * 1024 * 1024;
const isPdfDataUrl = d => isDataUrl(d) && d.startsWith('data:application/pdf;base64,JVBER'); // „%PDF“
async function processPdf(file) {
  if (file.size > MAX_PDF) throw new Error(`Die PDF ist zu groß (max. ${fmtBytes(MAX_PDF)}). Tipp: in kleinerer Qualität exportieren.`);
  let d = await readAsDataURL(file);
  d = 'data:application/pdf;base64,' + d.slice(d.indexOf(',') + 1); // MIME-Typ vereinheitlichen
  if (!isPdfDataUrl(d)) throw new Error('Das ist keine gültige PDF-Datei.');
  return d;
}
const pdfUrls = new Map();
/** Blob-URL zur PDF (einmal pro Datei erzeugt und wiederverwendet). */
function pdfUrl(meta) {
  if (pdfUrls.has(meta.id)) return pdfUrls.get(meta.id);
  const d = store.getFile(meta.id);
  if (!isPdfDataUrl(d)) return null;
  const url = URL.createObjectURL(dataUrlToBlob(d, 'application/pdf'));
  pdfUrls.set(meta.id, url);
  return url;
}
const hasPdfViewer = () => navigator.pdfViewerEnabled !== false;
/** Eingebettete PDF-Ansicht bzw. Ersatzkarte mit Öffnen/Herunterladen. */
function pdfView(meta, { actions = false } = {}) {
  const url = pdfUrl(meta);
  if (!url) return h('div', { class: 'pdf-card' }, h('div', { class: 'big', 'aria-hidden': 'true' }, '⚠️'), h('p', {}, 'PDF nicht verfügbar'));
  const buttons = () => h('div', { class: 'pdf-actions' },
    h('a', { class: 'btn primary small', href: url, target: '_blank', rel: 'noopener' }, '📄 PDF öffnen'),
    h('button', { class: 'btn small', type: 'button', onclick: () => downloadAttachment(meta) }, '⬇ Herunterladen'));
  if (!hasPdfViewer()) return h('div', { class: 'pdf-card' }, h('div', { class: 'big', 'aria-hidden': 'true' }, '📄'), h('p', {}, meta.name), h('span', { class: 'hint' }, fmtBytes(meta.size)), buttons());
  const frame = h('iframe', { class: 'pdf-frame', src: url + '#navpanes=0&view=FitH', title: `PDF: ${meta.name}` });
  return actions ? h('div', {}, frame, buttons()) : frame;
}
/** Große PDF-Ansicht als Overlay (z. B. zum Zeigen auf der Leinwand). */
function openPdfOverlay(meta) {
  if (document.querySelector('.overlay')) return;
  const prev = document.activeElement;
  const close = () => { ov.remove(); prev?.focus?.(); };
  const closeBtn = h('button', { class: 'btn', type: 'button', onclick: close }, '✕ Schließen');
  const ov = h('div', { class: 'overlay', role: 'dialog', 'aria-modal': 'true', 'aria-label': `PDF: ${meta.name}`, onclick: e => { if (e.target === ov) close(); } },
    h('div', { class: 'overlay-pdf' }, h('div', { class: 'row' }, h('strong', {}, '📄 ', meta.name), closeBtn), pdfView(meta)));
  ov.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') close(); });
  document.body.append(ov);
  closeBtn.focus();
}
function fileButtons(q, cls = '') {
  return (q.files || []).map(f => h('button', { class: ('btn small ' + cls).trim(), type: 'button', onclick: () => downloadAttachment(f), 'aria-label': `${f.name} herunterladen, ${fmtBytes(f.size)}` },
    h('span', { 'aria-hidden': 'true' }, '📎'), h('span', {}, f.name), h('span', { class: 'file-size', 'aria-hidden': 'true' }, fmtBytes(f.size))));
}

/* ==================== 2. Fragetypen & Logik ==================== */

const TYPES = {
  mc:        { label: 'Multiple Choice', icon: '📊' },
  wordcloud: { label: 'Wortwolke',       icon: '☁️' },
  scale:     { label: 'Skala',           icon: '🎚️' },
  open:      { label: 'Offene Frage',    icon: '💬' },
  quiz:      { label: 'Quiz',            icon: '🏆' },
  ranking:   { label: 'Ranking',         icon: '🥇' },
};
const OPTION_TYPES = ['mc', 'quiz', 'ranking'];

function defaultQuestion(type) {
  switch (type) {
    case 'wordcloud': return { type, title: 'Was fällt dir spontan ein?' };
    case 'scale':     return { type, title: 'Wie siehst du das?', statements: ['Aussage 1', 'Aussage 2'] };
    case 'open':      return { type, title: 'Was möchtest du uns mitteilen?' };
    case 'quiz':      return { type, title: 'Neue Quizfrage', options: ['Antwort A', 'Antwort B', 'Antwort C', 'Antwort D'], correct: 0, timer: 20 };
    case 'ranking':   return { type, title: 'Bring die Punkte in eine Reihenfolge', options: ['Punkt 1', 'Punkt 2', 'Punkt 3'] };
    default:          return { type: 'mc', title: 'Neue Multiple-Choice-Frage', options: ['Option 1', 'Option 2', 'Option 3'] };
  }
}

/**
 * Bringt eine (evtl. importierte oder fremde) Frage in eine gültige Form.
 * keepEmpty: leere Optionen beibehalten (nötig, während im Editor getippt wird).
 */
function normalizeQuestion(raw, { keepEmpty = false } = {}) {
  raw = raw && typeof raw === 'object' ? raw : {};
  const type = hasOwn(TYPES, raw.type) ? raw.type : 'mc';
  const list = (a, max, n) => {
    let l = (Array.isArray(a) ? a : []).map(x => clean(x, max));
    if (!keepEmpty) l = l.filter(Boolean);
    return l.slice(0, n);
  };
  const q = {
    id: typeof raw.id === 'string' && /^[\w-]{1,40}$/.test(raw.id) ? raw.id : uid(),
    type,
    title: clean(raw.title, 200) || (keepEmpty ? '' : 'Neue Frage'),
    locked: !!raw.locked,
    hidden: !!raw.hidden,
    // Optionales Bild zur Frage – nur geprüfte data:image-URLs werden akzeptiert
    image: typeof raw.image === 'string' && raw.image.length <= 1500000 && IMAGE_RE.test(raw.image) ? raw.image : '',
    imageAlt: clean(raw.imageAlt, 150),
    // Optionale Datei-Anhänge (nur Metadaten, Inhalt via store.getFile)
    files: (Array.isArray(raw.files) ? raw.files : []).map(normFile).filter(Boolean).slice(0, MAX_FILES),
    // Optionale PDF als Folieninhalt (statt Bild)
    pdf: (m => (m ? { ...m, type: 'application/pdf' } : null))(normFile(raw.pdf)),
  };
  if (OPTION_TYPES.includes(type)) {
    q.options = list(raw.options, 80, 8);
    while (q.options.length < 2) q.options.push(`Option ${q.options.length + 1}`);
  }
  if (type === 'quiz') {
    q.correct = clampInt(raw.correct, 0, q.options.length - 1, 0);
    q.timer = clampInt(raw.timer, 5, 300, 20);
  }
  if (type === 'scale') {
    q.statements = list(raw.statements, 120, 8);
    if (!q.statements.length) q.statements.push('Aussage 1');
    q.minLabel = clean(raw.minLabel, 30) || (keepEmpty ? '' : 'Stimme nicht zu');
    q.maxLabel = clean(raw.maxLabel, 30) || (keepEmpty ? '' : 'Stimme voll zu');
  }
  return q;
}
const titleOf = q => q.title || 'Ohne Titel';
const optLabel = (q, i) => q.options[i] || `Option ${i + 1}`;
const stmtLabel = (q, i) => q.statements[i] || `Aussage ${i + 1}`;
const normWord = w => clean(w, 25).toLowerCase();

/** Prüft eine Antwort serverseitig-artig. Gibt {data} oder {error} zurück. */
function validateAnswer(q, data) {
  data = data && typeof data === 'object' ? data : {};
  switch (q.type) {
    case 'mc': case 'quiz': {
      const c = Number(data.choice);
      if (!Number.isInteger(c) || c < 0 || c >= q.options.length) return { error: 'Bitte wähle eine Option.' };
      return { data: { choice: c } };
    }
    case 'wordcloud': {
      const words = [...new Set((Array.isArray(data.words) ? data.words : []).map(normWord).filter(Boolean))].slice(0, 3);
      if (!words.length) return { error: 'Bitte gib mindestens einen Begriff ein.' };
      return { data: { words } };
    }
    case 'scale': {
      const r = Array.isArray(data.ratings) ? data.ratings.map(Number) : [];
      if (r.length !== q.statements.length || r.some(x => !Number.isInteger(x) || x < 1 || x > 5)) return { error: 'Bitte bewerte alle Aussagen.' };
      return { data: { ratings: r } };
    }
    case 'open': {
      const text = clean(data.text, 280);
      if (!text) return { error: 'Bitte schreib eine Antwort.' };
      return { data: { text } };
    }
    case 'ranking': {
      const o = Array.isArray(data.order) ? data.order.map(Number) : [];
      const ok = o.length === q.options.length && [...o].sort((a, b) => a - b).every((v, i) => v === i);
      if (!ok) return { error: 'Ungültige Reihenfolge.' };
      return { data: { order: o } };
    }
  }
  return { error: 'Unbekannter Fragetyp.' };
}

/** Wertet alle Antworten einer Frage aus. */
function aggregate(q, list = []) {
  list = Array.isArray(list) ? list : [];
  const n = list.length;
  switch (q.type) {
    case 'mc': case 'quiz': {
      const counts = q.options.map(() => 0);
      list.forEach(r => { const c = r?.data?.choice; if (c in counts) counts[c]++; });
      return { n, counts };
    }
    case 'wordcloud': {
      const map = new Map();
      list.forEach(r => (r?.data?.words || []).forEach(w => map.set(w, (map.get(w) || 0) + 1)));
      return { n, words: [...map].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])) };
    }
    case 'scale': {
      const statements = q.statements.map((_, i) => {
        const vals = list.map(r => r?.data?.ratings?.[i]).filter(Number.isInteger);
        return { n: vals.length, avg: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0 };
      });
      return { n, statements };
    }
    case 'open':
      return { n, answers: list.filter(r => r?.data?.text).map(r => ({ id: `${r.pid}-${r.t}`, text: r.data.text })) };
    case 'ranking': {
      const k = q.options.length, score = Array(k).fill(0), rankSum = Array(k).fill(0);
      list.forEach(r => (r?.data?.order || []).forEach((opt, pos) => { if (opt < k) { score[opt] += k - pos; rankSum[opt] += pos + 1; } }));
      const items = q.options.map((_, i) => ({ i, score: score[i], avgRank: n ? rankSum[i] / n : 0 }))
        .sort((a, b) => b.score - a.score || a.i - b.i);
      return { n, items };
    }
  }
  return { n };
}

/** Quiz-Phase: 'idle' (nicht gestartet) | 'running' | 'ended' */
function quizPhase(q, s, now = Date.now()) {
  const qs = s.quiz?.[q.id];
  if (!qs) return 'idle';
  if (qs.revealed || now >= qs.startedAt + q.timer * 1000) return 'ended';
  return 'running';
}
const quizLeftMs = (q, s) => { const qs = s.quiz?.[q.id]; return qs ? Math.max(0, qs.startedAt + q.timer * 1000 - Date.now()) : q.timer * 1000; };

function seedState() {
  return {
    version: 1, rev: 0, title: 'Beispielpräsentation', code: newCode(), current: 0, responses: {}, quiz: {},
    questions: [
      { type: 'mc', title: 'Welches Getränk brauchst du gerade am meisten?', options: ['Kaffee', 'Tee', 'Wasser', 'Mate'] },
      { type: 'wordcloud', title: 'Was fällt dir spontan zum Thema „Zusammenarbeit“ ein?' },
      { type: 'scale', title: 'Wie sehr stimmst du zu?', statements: ['Meetings sind meistens produktiv', 'Ich arbeite gern remote', 'Unsere Tools sind intuitiv'] },
      { type: 'open', title: 'Welche Frage soll heute unbedingt beantwortet werden?' },
      { type: 'quiz', title: 'Wie viele Planeten hat unser Sonnensystem?', options: ['7', '8', '9', '10'], correct: 1, timer: 20 },
      { type: 'ranking', title: 'Was ist dir bei der Arbeit am wichtigsten?', options: ['Flexibilität', 'Gehalt', 'Team', 'Sinnhaftigkeit', 'Weiterbildung'] },
    ].map(q => normalizeQuestion(q)),
  };
}

/* ==================== 3. Store (Datenlogik) ====================
 * Die gesamte Oberfläche spricht NUR über diese API mit den Daten.
 * Version 1: localStorage + BroadcastChannel (Sync zwischen Tabs desselben Browsers).
 *
 * --- Austausch gegen ein echtes Backend ---
 * Firebase Realtime Database:
 *   - read()/write(): durch onValue(ref(db, 'sessions/' + code)) bzw. set()/update() ersetzen.
 *   - commit(mutate): durch runTransaction(ref, mutate) ersetzen → atomar, auch bei vielen gleichzeitigen Stimmen.
 *   - Stimmen besser einzeln unter responses/{qid}/{pid} schreiben; Security-Rule
 *     ".write": "!data.exists()" erzwingt eine Stimme pro Teilnehmer:in.
 *   - Präsenz (heartbeat/leave): presence/{pid} mit onDisconnect().remove().
 * Supabase:
 *   - Tabellen sessions, questions, responses; UNIQUE(question_id, participant_id).
 *   - subscribe(): supabase.channel(...).on('postgres_changes', ...) und danach emit('state').
 *   - Präsenz über Realtime-Presence (channel.track()).
 * Datei-Anhänge (putFile/getFile): in Firebase Storage bzw. Supabase Storage hochladen und
 *   in der Frage nur Metadaten + Download-URL speichern.
 * Die Methodennamen (getState, subscribe, vote, …) bleiben gleich – die Ansichten müssen
 * nicht angepasst werden. Die Validierung (validateAnswer) gehört dann zusätzlich auf den Server.
 * ============================================================ */
const store = (() => {
  const KEY = 'mentiLite:state:v1', PKEY = 'mentiLite:presence:v1';
  const listeners = new Set();
  const channel = typeof BroadcastChannel === 'function' ? new BroadcastChannel('mentiLite') : null;
  let lastRaw = null;

  function read() {
    try {
      const raw = LS.getItem(KEY);
      const s = JSON.parse(raw);
      if (!s || !Array.isArray(s.questions)) return null;
      s.questions = s.questions.map(q => normalizeQuestion(q, { keepEmpty: true }));
      s.responses = s.responses && typeof s.responses === 'object' ? s.responses : {};
      s.quiz = s.quiz && typeof s.quiz === 'object' ? s.quiz : {};
      s.code = /^\d{6}$/.test(s.code) ? s.code : newCode();
      s.title = clean(s.title, 120);
      s.joinBase = cleanJoinBase(s.joinBase);
      s.current = clampInt(s.current, 0, Math.max(0, s.questions.length - 1), 0);
      lastRaw = raw;
      return s;
    } catch { return null; }
  }
  function write(s) {
    try { const raw = JSON.stringify(s); LS.setItem(KEY, raw); lastRaw = raw; return true; }
    catch (e) { console.error('Speichern fehlgeschlagen', e); return false; }
  }
  function emit(kind) { listeners.forEach(fn => { try { fn(state, kind); } catch (e) { console.error(e); } }); }

  /** Liest frischen Stand, wendet Änderung an, speichert und benachrichtigt alle Tabs. */
  function commit(mutate) {
    const draft = read() || state;
    const res = mutate(draft);
    if (res && res.abort) return res;
    draft.rev = (draft.rev || 0) + 1;
    if (!write(draft)) {
      // Speicher voll (meist wegen Bildern): Änderung verwerfen, alten Stand behalten
      return { abort: true, error: 'Speicher voll – bitte ein kleineres Bild nehmen oder andere Bilder entfernen.' };
    }
    state = draft;
    channel?.postMessage({ kind: 'state' });
    emit('state');
    return res || { ok: true };
  }
  function syncFromStorage() {
    if (LS.getItem(KEY) === lastRaw) return;
    const s = read();
    if (s) { state = s; emit('state'); }
  }
  if (channel) channel.onmessage = e => (e.data?.kind === 'presence' ? emit('presence') : syncFromStorage());
  addEventListener('storage', e => { if (e.key === KEY) syncFromStorage(); else if (e.key === PKEY) emit('presence'); });

  let state = read();
  if (!state) { state = seedState(); write(state); }

  const idx = (s, id) => s.questions.findIndex(q => q.id === id);

  /* ---- Datei-Anhänge: ein eigener Schlüssel pro Datei ---- */
  const FPREFIX = 'mentiLite:file:', fcache = new Map();
  function getFileRaw(id) {
    if (fcache.has(id)) return fcache.get(id);
    const d = LS.getItem(FPREFIX + id);
    if (d) fcache.set(id, d);
    return d;
  }
  function removeFile(id) { LS.removeItem(FPREFIX + id); fcache.delete(id); }
  const fileIdsInUse = s => new Set(s.questions.flatMap(q => [...(q.files || []).map(f => f.id), ...(q.pdf ? [q.pdf.id] : [])]));
  /** Commit für Bearbeitungen: entfernte Anhänge löschen, verwaiste nach 10 Min. Schonfrist aufräumen. */
  function editCommit(mutate) {
    const before = fileIdsInUse(read() || state);
    const res = commit(mutate);
    if (res && res.abort) return res;
    const used = fileIdsInUse(state), now = Date.now();
    before.forEach(id => { if (!used.has(id)) removeFile(id); });
    const keys = [];
    for (let i = 0; i < LS.length; i++) { const k = LS.key(i); if (k && k.startsWith(FPREFIX)) keys.push(k); }
    keys.forEach(k => {
      const id = k.slice(FPREFIX.length);
      if (used.has(id)) return;
      const ts = parseInt(id.slice(2, 10), 36); // die ID beginnt mit einem Zeitstempel (uid)
      if (!Number.isFinite(ts) || now - ts > 10 * 60 * 1000) removeFile(id);
    });
    return res;
  }
  /** Führt fn aus und sorgt dafür, dass die aktuell live geschaltete Frage dieselbe bleibt. */
  function keepCurrent(s, fn) {
    const curId = s.questions[s.current]?.id;
    fn();
    const ni = idx(s, curId);
    s.current = ni >= 0 ? ni : Math.max(0, Math.min(s.current, s.questions.length - 1));
  }
  const readP = () => { try { return JSON.parse(LS.getItem(PKEY)) || {}; } catch { return {}; } };
  const writeP = p => { try { LS.setItem(PKEY, JSON.stringify(p)); } catch {} channel?.postMessage({ kind: 'presence' }); };

  return {
    getState: () => state,
    /** Ungefähre Größe der gespeicherten Daten in Zeichen (localStorage-Limit ca. 5 Mio.). */
    /** Belegter Speicher aller Tool-Daten (Zeichen ≈ Bytes; Browser-Limit meist ca. 5 Mio.). */
    storageSize() {
      let n = 0;
      for (let i = 0; i < LS.length; i++) { const k = LS.key(i); if (k && k.startsWith('mentiLite')) n += (LS.getItem(k) || '').length; }
      return n;
    },
    putFile(dataUrl) {
      const id = 'f-' + uid();
      try { LS.setItem(FPREFIX + id, dataUrl); }
      catch { return { error: 'Nicht genug Browser-Speicher. Entferne andere Anhänge oder Bilder oder nutze kleinere Dateien.' }; }
      fcache.set(id, dataUrl);
      return { id };
    },
    getFile: getFileRaw,
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    currentQuestion: (s = state) => s.questions[s.current] || null,

    setCurrent(i) {
      if (!state.questions.length) return;
      const t = Math.max(0, Math.min(state.questions.length - 1, i));
      if (t !== state.current) commit(s => { s.current = Math.max(0, Math.min(s.questions.length - 1, i)); });
    },
    setTitle: t => commit(s => { s.title = clean(t, 120); }),
    setJoinBase: u => commit(s => { s.joinBase = cleanJoinBase(u); }),
    regenerateCode: () => commit(s => { s.code = newCode(); }),

    addQuestion(type, afterId) {
      return commit(s => {
        const q = normalizeQuestion(defaultQuestion(type));
        const i = idx(s, afterId);
        keepCurrent(s, () => s.questions.splice(i < 0 ? s.questions.length : i + 1, 0, q));
        return { ok: true, id: q.id };
      });
    },
    duplicateQuestion(id) {
      return commit(s => {
        const i = idx(s, id); if (i < 0) return { abort: true };
        const q = normalizeQuestion({ ...s.questions[i], id: uid(), title: clean(s.questions[i].title + ' (Kopie)', 200) }, { keepEmpty: true });
        keepCurrent(s, () => s.questions.splice(i + 1, 0, q));
        return { ok: true, id: q.id };
      });
    },
    /** Textänderungen behalten Antworten; ändert sich die Anzahl der Optionen/Aussagen, werden sie zurückgesetzt. */
    updateQuestion(id, patch) {
      return editCommit(s => {
        const i = idx(s, id); if (i < 0) return { abort: true };
        const old = s.questions[i];
        const q = normalizeQuestion({ ...old, ...patch, id, type: old.type }, { keepEmpty: true });
        if ((old.options?.length ?? 0) !== (q.options?.length ?? 0) || (old.statements?.length ?? 0) !== (q.statements?.length ?? 0)) {
          delete s.responses[id]; delete s.quiz[id];
        }
        s.questions[i] = q;
      });
    },
    changeType(id, type) {
      return editCommit(s => {
        const i = idx(s, id); if (i < 0 || !hasOwn(TYPES, type)) return { abort: true };
        const old = s.questions[i], base = defaultQuestion(type);
        if (OPTION_TYPES.includes(type) && old.options) base.options = old.options.slice();
        s.questions[i] = normalizeQuestion({ ...base, id, title: old.title, locked: old.locked, hidden: old.hidden, image: old.image, imageAlt: old.imageAlt, files: old.files, pdf: old.pdf }, { keepEmpty: true });
        delete s.responses[id]; delete s.quiz[id];
      });
    },
    deleteQuestion(id) {
      return editCommit(s => {
        const i = idx(s, id); if (i < 0) return { abort: true };
        keepCurrent(s, () => s.questions.splice(i, 1));
        delete s.responses[id]; delete s.quiz[id];
      });
    },
    moveQuestion(id, dir) {
      return commit(s => {
        const i = idx(s, id), j = i + dir;
        if (i < 0 || j < 0 || j >= s.questions.length) return { abort: true };
        keepCurrent(s, () => { [s.questions[i], s.questions[j]] = [s.questions[j], s.questions[i]]; });
      });
    },
    resetResults: id => commit(s => { delete s.responses[id]; delete s.quiz[id]; }),
    startQuiz: id => commit(s => { s.quiz[id] = { startedAt: Date.now() }; s.responses[id] = []; }),
    revealQuiz: id => commit(s => { if (s.quiz[id]) s.quiz[id].revealed = true; }),

    /** Stimmabgabe inkl. aller Prüfungen (aktive Frage, gesperrt, schon abgestimmt, Quiz-Zeit, Inhalt). */
    vote(qid, pid, data) {
      return commit(s => {
        const q = s.questions[s.current];
        if (!q || q.id !== qid) return { abort: true, error: 'Diese Frage ist nicht mehr aktiv.' };
        if (q.locked) return { abort: true, error: 'Die Abstimmung ist geschlossen.' };
        if (q.type === 'quiz' && quizPhase(q, s) !== 'running') return { abort: true, error: 'Die Zeit ist abgelaufen.' };
        const list = (s.responses[qid] ||= []);
        if (list.some(r => r.pid === pid)) return { abort: true, error: 'Du hast bereits abgestimmt.' };
        const v = validateAnswer(q, data);
        if (v.error) return { abort: true, error: v.error };
        list.push({ pid, t: Date.now(), data: v.data });
        return { ok: true };
      });
    },
    hasVoted: (qid, pid, s = state) => (s.responses[qid] || []).some(r => r.pid === pid),
    myResponse: (qid, pid, s = state) => (s.responses[qid] || []).find(r => r.pid === pid) || null,

    /** Erzeugt zufällige Testantworten – praktisch zum Ausprobieren der Visualisierungen. */
    addTestResponses(id, n = 10) {
      return commit(s => {
        const q = s.questions.find(x => x.id === id); if (!q) return { abort: true };
        const list = (s.responses[id] ||= []);
        const rnd = k => Math.floor(Math.random() * k);
        const skew = k => Math.min(k - 1, Math.floor(Math.pow(Math.random(), 1.7) * k)); // bevorzugt vordere Einträge
        const WORDS = ['teamwork', 'vertrauen', 'kommunikation', 'spaß', 'ziele', 'feedback', 'offenheit', 'respekt', 'kreativität', 'fokus', 'humor', 'klarheit'];
        const OPEN = ['Wie geht es nach dem Projekt weiter?', 'Gibt es die Folien zum Nachlesen?', 'Wann ist die nächste Session?', 'Wie messen wir den Erfolg?', 'Wer ist Ansprechperson bei Fragen?', 'Mehr Pausen bitte! ☕', 'Können wir das remote wiederholen?', 'Was sind die nächsten drei Schritte?'];
        for (let i = 0; i < n; i++) {
          let data;
          switch (q.type) {
            case 'mc': case 'quiz': data = { choice: skew(q.options.length) }; break;
            case 'wordcloud': data = { words: [...new Set(Array.from({ length: 1 + rnd(3) }, () => WORDS[skew(WORDS.length)]))] }; break;
            case 'scale': data = { ratings: q.statements.map(() => 1 + Math.min(4, Math.round(Math.random() * 2) + rnd(3))) }; break;
            case 'open': data = { text: OPEN[rnd(OPEN.length)] }; break;
            case 'ranking': {
              const o = q.options.map((_, k) => k);
              for (let a = o.length - 1; a > 0; a--) { const b = rnd(a + 1); [o[a], o[b]] = [o[b], o[a]]; }
              data = { order: o }; break;
            }
          }
          list.push({ pid: 'test-' + uid(), t: Date.now() + i, data });
        }
        if (q.type === 'quiz') s.quiz[id] = { startedAt: Date.now() - q.timer * 1000, revealed: true };
      });
    },

    exportPresentation() {
      const files = {};
      fileIdsInUse(state).forEach(id => { const d = getFileRaw(id); if (d) files[id] = d; });
      return { format: 'mentilite-presentation', version: 1, title: state.title, questions: state.questions.map(({ locked, hidden, ...q }) => q), files };
    },
    importPresentation(obj) {
      if (!obj || typeof obj !== 'object' || !Array.isArray(obj.questions)) throw new Error('„questions“ fehlt in der Datei.');
      if (obj.questions.length > 100) throw new Error('Maximal 100 Fragen erlaubt.');
      const seen = new Set();
      const qs = obj.questions.map(raw => { const q = normalizeQuestion(raw); if (seen.has(q.id)) q.id = uid(); seen.add(q.id); return q; });
      if (!qs.length) throw new Error('Die Datei enthält keine Fragen.');
      // Mitgelieferte Dateiinhalte prüfen und speichern; fehlende Anhänge werden entfernt
      const files = obj.files && typeof obj.files === 'object' ? obj.files : {};
      const ensure = m => {
        if (LS.getItem(FPREFIX + m.id)) return true;
        const d = hasOwn(files, m.id) ? files[m.id] : null;
        if (!isDataUrl(d)) return false;
        try { LS.setItem(FPREFIX + m.id, d); fcache.set(m.id, d); return true; }
        catch { throw new Error('Nicht genug Browser-Speicher für die Anhänge.'); }
      };
      qs.forEach(q => { q.files = q.files.filter(ensure); if (q.pdf && !(ensure(q.pdf) && isPdfDataUrl(getFileRaw(q.pdf.id)))) q.pdf = null; });
      const r = editCommit(s => { s.title = clean(obj.title, 120) || 'Importierte Präsentation'; s.questions = qs; s.responses = {}; s.quiz = {}; s.current = 0; });
      if (r?.error) throw new Error(r.error);
    },
    resetAll() { const fresh = seedState(); editCommit(s => { Object.keys(s).forEach(k => delete s[k]); Object.assign(s, fresh); }); },

    /* Präsenz: wer in den letzten 15 s ein Lebenszeichen gesendet hat, zählt als aktiv. */
    heartbeat(pid) {
      const p = readP(), now = Date.now();
      p[pid] = now;
      for (const k of Object.keys(p)) if (now - p[k] > 60000) delete p[k];
      writeP(p);
    },
    leave(pid) { const p = readP(); delete p[pid]; writeP(p); },
    participantCount() { const now = Date.now(); return Object.values(readP()).filter(t => now - t < 15000).length; },
  };
})();

/* ==================== 4. QR-Code (Byte-Modus, Fehlerkorrektur M, Version 1–20) ==================== */
const QR = (() => {
  const ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26];
  const BLK = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16];
  const rawModules = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; } return r; };
  const dataCw = v => Math.floor(rawModules(v) / 8) - ECC[v] * BLK[v];
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11d); z ^= ((y >>> i) & 1) * x; } return z; };
  function divisor(deg) {
    const r = Array(deg).fill(0); r[deg - 1] = 1; let root = 1;
    for (let i = 0; i < deg; i++) { for (let j = 0; j < deg; j++) { r[j] = mul(r[j], root); if (j + 1 < deg) r[j] ^= r[j + 1]; } root = mul(root, 2); }
    return r;
  }
  function remainder(data, div) {
    const r = Array(div.length).fill(0);
    for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= mul(c, f); }); }
    return r;
  }
  function alignPos(v) {
    if (v === 1) return [];
    const n = Math.floor(v / 7) + 2, size = v * 4 + 17, step = Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2, res = [6];
    for (let p = size - 7; res.length < n; p -= step) res.splice(1, 0, p);
    return res;
  }
  function encode(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let v = 1;
    for (; v <= 20; v++) if (4 + (v < 10 ? 8 : 16) + bytes.length * 8 <= dataCw(v) * 8) break;
    if (v > 20) return null;
    const cap = dataCw(v) * 8, bits = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    push(4, 4); push(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => push(b, 8));
    push(0, Math.min(4, cap - bits.length)); push(0, (8 - (bits.length % 8)) % 8);
    for (let pad = 0xec; bits.length < cap; pad ^= 0xec ^ 0x11) push(pad, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; data.push(b); }
    // Blöcke + Fehlerkorrektur, dann verschachteln
    const nb = BLK[v], ecl = ECC[v], raw = Math.floor(rawModules(v) / 8), nShort = nb - (raw % nb), shortLen = Math.floor(raw / nb);
    const div = divisor(ecl), blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - ecl + (i < nShort ? 0 : 1)); k += dat.length;
      const ecc = remainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const cw = [];
    for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - ecl || j >= nShort) cw.push(b[i]); });
    // Matrix mit Funktionsmustern
    const size = v * 4 + 17;
    const m = Array.from({ length: size }, () => Array(size).fill(false));
    const fn = Array.from({ length: size }, () => Array(size).fill(false));
    const set = (x, y, d) => { m[y][x] = d; fn[y][x] = true; };
    const bit = (x, i) => ((x >>> i) & 1) !== 0;
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    [[3, 3], [size - 4, 3], [3, size - 4]].forEach(([cx, cy]) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, d !== 2 && d !== 4);
      }
    });
    const ap = alignPos(v), na = ap.length;
    for (let i = 0; i < na; i++) for (let j = 0; j < na; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(ap[i] + dx, ap[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const drawFormat = mask => {
      const d = (0 << 3) | mask; // ECC-Level M = 0b00
      let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412;
      for (let i = 0; i <= 5; i++) set(8, i, bit(b, i));
      set(8, 7, bit(b, 6)); set(8, 8, bit(b, 7)); set(7, 8, bit(b, 8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, bit(b, i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(b, i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(b, i));
      set(8, size - 8, true);
    };
    drawFormat(0);
    if (v >= 7) {
      let r = v; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1f25);
      const b = (v << 12) | r;
      for (let i = 0; i < 18; i++) { const d = bit(b, i), a = size - 11 + (i % 3), c = Math.floor(i / 3); set(a, c, d); set(c, a, d); }
    }
    // Daten im Zickzack einzeichnen
    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!fn[y][x] && i < cw.length * 8) { m[y][x] = bit(cw[i >>> 3], 7 - (i & 7)); i++; }
      }
    }
    // Maske 0 anwenden
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && (x + y) % 2 === 0) m[y][x] = !m[y][x];
    return m;
  }
  function svg(text) {
    const m = encode(text); if (!m) return null;
    const NS = 'http://www.w3.org/2000/svg', q = 4, n = m.length + q * 2;
    const el = document.createElementNS(NS, 'svg');
    el.setAttribute('viewBox', `0 0 ${n} ${n}`); el.setAttribute('shape-rendering', 'crispEdges');
    el.setAttribute('role', 'img'); el.setAttribute('aria-label', 'QR-Code zur Teilnahme');
    const bg = document.createElementNS(NS, 'rect'); bg.setAttribute('width', n); bg.setAttribute('height', n); bg.setAttribute('fill', '#fff');
    let d = '';
    m.forEach((row, y) => row.forEach((dark, x) => { if (dark) d += `M${x + q} ${y + q}h1v1h-1z`; }));
    const path = document.createElementNS(NS, 'path'); path.setAttribute('d', d); path.setAttribute('fill', '#000');
    el.append(bg, path);
    return el;
  }
  return { encode, svg };
})();

/* ==================== 5. Visualisierungen ====================
 * Jede Visualisierung baut einmal ihr DOM auf und liefert update(agg, q, s),
 * das nur Werte ändert – so laufen CSS-Übergänge flüssig, wenn neue Stimmen eintreffen.
 */
function barsViz(el, q, { reveal = false } = {}) {
  const wrap = h('div', { class: 'bars' });
  const cols = q.options.map((_, i) => {
    const val = h('span'), cnt = h('small');
    const fill = h('div', { class: 'bar-fill', style: { background: color(i) } });
    const cls = 'bar-col' + (reveal ? (i === q.correct ? ' correct' : ' wrong') : '');
    const col = h('div', { class: cls, role: 'group' },
      h('div', { class: 'bar-val' }, val, cnt), h('div', { class: 'bar-track' }, fill),
      h('div', { class: 'bar-label' }, reveal && i === q.correct ? '✓ ' : '', optLabel(q, i)));
    wrap.append(col);
    return { col, val, cnt, fill, label: optLabel(q, i) };
  });
  el.append(wrap);
  return {
    update(agg) {
      const max = Math.max(1, ...agg.counts);
      void wrap.offsetHeight; // Reflow, damit die erste Animation von 0 startet
      cols.forEach((c, i) => {
        const n = agg.counts[i] || 0, p = pct(n, agg.n);
        c.val.textContent = `${p} %`;
        c.cnt.textContent = plural(n, 'Stimme', 'Stimmen');
        c.fill.style.height = `${(n / max) * 100}%`;
        c.col.setAttribute('aria-label', `${c.label}: ${plural(n, 'Stimme', 'Stimmen')}, ${p} Prozent`);
      });
    },
  };
}

function quizViz(el, q, s) {
  const phase = quizPhase(q, s);
  if (phase === 'ended') return barsViz(el, q, { reveal: true });
  const tiles = h('div', { class: 'tiles' }, q.options.map((_, i) =>
    h('div', { class: 'tile', style: { '--tc': color(i), animationDelay: `${i * 60}ms` } },
      h('span', { class: 'shape', 'aria-hidden': 'true' }, SHAPES[i]), h('span', {}, optLabel(q, i)))));
  if (phase === 'idle') {
    el.append(h('div', { class: 'quiz-run' }, h('p', { class: 'quiz-hint' }, `⏱ ${q.timer} Sekunden · Quiz startet auf Knopfdruck`), tiles));
    return { update() {} };
  }
  const num = h('b'), ring = h('div', { class: 'countdown', role: 'timer', 'aria-label': 'Verbleibende Sekunden' }, h('span', {}, num));
  el.append(h('div', { class: 'quiz-run' }, ring, tiles));
  return {
    update(agg, q2, s2) {
      const left = quizLeftMs(q2, s2);
      num.textContent = Math.ceil(left / 1000);
      ring.style.setProperty('--p', (left / (q2.timer * 1000)).toFixed(3));
    },
  };
}

function cloudViz(el) {
  const box = h('div', { class: 'cloud', role: 'list', 'aria-label': 'Wortwolke' });
  const empty = h('div', { class: 'empty-note' }, 'Warte auf Begriffe …');
  el.append(box, empty);
  const nodes = new Map();
  return {
    update(agg) {
      empty.hidden = agg.words.length > 0;
      const top = agg.words.slice(0, 60);
      const max = top[0]?.[1] || 1;
      const density = Math.max(0.5, 1 - Math.max(0, top.length - 8) * 0.016);
      const keep = new Set(top.map(w => w[0]));
      for (const [w, node] of nodes) if (!keep.has(w)) { node.remove(); nodes.delete(w); }
      // Größte Begriffe in die Mitte: abwechselnd vorne/hinten einsortieren
      const ordered = [];
      top.forEach((w, i) => (i % 2 ? ordered.push(w) : ordered.unshift(w)));
      ordered.forEach(([w, c], k) => {
        let node = nodes.get(w);
        if (!node) {
          node = h('span', { class: 'word pop', role: 'listitem', style: { color: color(strHash(w)) } }, w);
          node.addEventListener('animationend', () => node.classList.remove('pop'), { once: true });
          nodes.set(w, node);
        }
        node.style.fontSize = `${((1.1 + 3.4 * (c / max)) * density).toFixed(2)}em`;
        node.title = `${c}×`;
        node.setAttribute('aria-label', `${w}: ${c}`);
        if (box.children[k] !== node) box.insertBefore(node, box.children[k] || null);
      });
    },
  };
}

function scaleViz(el, q) {
  const head = h('div', { class: 'scale-row' }, h('span'),
    h('div', { class: 'scale-ends' }, h('span', {}, `1 · ${q.minLabel || 'Stimme nicht zu'}`), h('span', {}, `${q.maxLabel || 'Stimme voll zu'} · 5`)), h('span'));
  const rows = q.statements.map((_, i) => {
    const fill = h('div', { class: 'scale-fill', style: { background: color(i) } });
    const dot = h('div', { class: 'scale-dot', style: { background: color(i) } });
    const val = h('span'), n = h('small');
    const row = h('div', { class: 'scale-row' }, h('div', { class: 'scale-label' }, stmtLabel(q, i)),
      h('div', { class: 'scale-track' }, fill, dot), h('div', { class: 'scale-val' }, val, n));
    return { row, fill, dot, val, n, label: stmtLabel(q, i) };
  });
  el.append(h('div', { class: 'scale' }, head, rows.map(r => r.row)));
  return {
    update(agg) {
      void el.offsetWidth;
      rows.forEach((r, i) => {
        const st = agg.statements[i] || { avg: 0, n: 0 };
        const p = st.n ? ((st.avg - 1) / 4) * 100 : 0;
        r.fill.style.width = `${p}%`; r.dot.style.left = `${p}%`; r.dot.style.opacity = st.n ? 1 : 0;
        r.val.textContent = st.n ? numDE(st.avg) : '–';
        r.n.textContent = ` (${st.n})`;
        r.row.setAttribute('aria-label', `${r.label}: Durchschnitt ${st.n ? numDE(st.avg) : 'keine Angaben'} von 5, ${st.n} Bewertungen`);
      });
    },
  };
}

function openViz(el) {
  const grid = h('div', { class: 'cards', role: 'list' });
  const empty = h('div', { class: 'empty-note' }, 'Warte auf Antworten …');
  el.append(grid, empty);
  let shown = new Set(), first = true;
  return {
    update(agg) {
      empty.hidden = agg.answers.length > 0;
      if (agg.answers.length < shown.size) { grid.replaceChildren(); shown = new Set(); first = true; }
      agg.answers.slice(-60).forEach((a, k) => {
        if (shown.has(a.id)) return;
        shown.add(a.id);
        const card = h('div', { class: 'card-ans', role: 'listitem', style: { '--tc': color(shown.size), animationDelay: first ? `${Math.min(k * 50, 900)}ms` : '0ms' } }, a.text);
        grid.prepend(card); // neueste zuerst
      });
      while (grid.children.length > 60) grid.lastChild.remove();
      first = false;
    },
  };
}

function rankingViz(el, q) {
  const list = h('div', { class: 'rank-list' });
  list.style.height = `calc(var(--rh) * ${q.options.length})`;
  const rows = q.options.map((_, i) => {
    const pos = h('span', { class: 'rank-pos' }), fill = h('div', { class: 'rank-fill', style: { background: color(i) } }), sc = h('span', { class: 'rank-score' });
    const row = h('div', { class: 'rank-row', style: { top: `calc(var(--rh) * ${i})` } }, pos, h('span', { class: 'rank-label' }, optLabel(q, i)), h('div', { class: 'rank-track' }, fill), sc);
    list.append(row);
    return { row, pos, fill, sc, label: optLabel(q, i) };
  });
  el.append(h('div', { style: { display: 'flex', alignItems: 'center', height: '100%' } }, list));
  return {
    update(agg) {
      const max = Math.max(1, ...agg.items.map(x => x.score));
      void list.offsetWidth;
      agg.items.forEach((it, rank) => {
        const r = rows[it.i];
        r.row.style.top = `calc(var(--rh) * ${rank})`;
        r.pos.textContent = `${rank + 1}.`;
        r.fill.style.width = `${(it.score / max) * 100}%`;
        r.sc.textContent = agg.n ? `Ø ${numDE(it.avgRank)}` : '';
        r.row.setAttribute('aria-label', `Platz ${rank + 1}: ${r.label}${agg.n ? `, durchschnittlicher Rang ${numDE(it.avgRank)}` : ''}`);
      });
    },
  };
}

function hiddenViz(el) {
  const n = h('p', { class: 'hint' });
  el.append(h('div', { class: 'hidden-res' }, h('div', { class: 'big', 'aria-hidden': 'true' }, '🙈'), h('p', {}, 'Ergebnisse sind verborgen'), n));

}

const VIZ = { mc: (el, q) => barsViz(el, q), quiz: quizViz, wordcloud: cloudViz, scale: scaleViz, open: openViz, ranking: rankingViz };

/** Rendert eine Folie; baut nur neu auf, wenn sich die Struktur ändert – sonst nur Werte-Update. */
function createSlideView(container, { live = true } = {}) {
  let sig = null, viz = null, countEl = null, statusEl = null;
  return {
    render(s, q) {
      if (!q) {
        if (sig !== 'empty') { sig = 'empty'; container.replaceChildren(h('div', { class: 'slide empty-slide' }, h('p', {}, 'Noch keine Fragen – lege im Editor eine an.'))); }
        return;
      }
      const phase = q.type === 'quiz' ? quizPhase(q, s) : '';
      const nsig = JSON.stringify([q.id, q.type, q.title, q.options, q.statements, q.minLabel, q.maxLabel, q.correct, q.timer, q.hidden, phase, imageKey(q), filesKey(q)]);
      if (nsig !== sig) {
        sig = nsig;
        const vizEl = h('div', { class: 'viz' });
        countEl = h('span', live ? { 'aria-live': 'polite' } : {});
        statusEl = h('span');
        container.replaceChildren(h('section', { class: 'slide', 'aria-label': 'Aktuelle Folie' },
          h('header', { class: 'slide-head' },
            h('div', { class: 'slide-type' }, h('span', { 'aria-hidden': 'true' }, TYPES[q.type].icon), TYPES[q.type].label),
            h('h2', { class: 'slide-title' }, titleOf(q))),
          q.pdf
            ? h('div', { class: 'slide-body pdf' }, h('figure', { class: 'slide-img' }, pdfView(q.pdf)), vizEl)
            : q.image
              ? h('div', { class: 'slide-body' }, h('figure', { class: 'slide-img' }, h('img', { src: q.image, alt: q.imageAlt || '' })), vizEl)
              : vizEl,
          h('footer', { class: 'slide-foot' },
            h('span', { class: 'foot-left' }, statusEl,
              q.pdf ? h('button', { class: 'btn small ghost', type: 'button', onclick: () => openPdfOverlay(q.pdf) }, '⛶ PDF groß anzeigen') : null,
              q.files.length ? h('span', { class: 'slide-files', role: 'group', 'aria-label': 'Anhänge' }, fileButtons(q, 'ghost')) : null),
            countEl)));
        const showHidden = q.hidden && !(q.type === 'quiz' && phase !== 'ended');
        viz = showHidden ? hiddenViz(vizEl) : VIZ[q.type](vizEl, q, s);
      }
      const agg = aggregate(q, s.responses[q.id]);
      viz.update(agg, q, s);
      const cnt = plural(agg.n, 'Antwort', 'Antworten');
      if (countEl.textContent !== cnt) countEl.textContent = cnt;
      statusEl.textContent = q.locked ? '🔒 Abstimmung gesperrt' : '';
    },
  };
}
