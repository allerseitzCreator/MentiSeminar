/* ---------- Export ---------- */
function resultsCSV(s) {
  const cell = v => {
    let t = String(v ?? '');
    if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; // Schutz vor Formel-Injection in Excel
    return /[";\r\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
  };
  const rows = [['Nr', 'Typ', 'Frage', 'Element', 'Anzahl', 'Wert', 'Info']];
  s.questions.forEach((q, i) => {
    const a = aggregate(q, s.responses[q.id]);
    const base = [i + 1, TYPES[q.type].label, titleOf(q)];
    switch (q.type) {
      case 'mc': case 'quiz':
        q.options.forEach((o, k) => rows.push([...base, optLabel(q, k), a.counts[k], `${pct(a.counts[k], a.n)} %`, q.type === 'quiz' && k === q.correct ? 'richtig' : ''])); break;
      case 'wordcloud': a.words.forEach(([w, c]) => rows.push([...base, w, c, '', ''])); break;
      case 'scale': q.statements.forEach((st, k) => rows.push([...base, stmtLabel(q, k), a.statements[k].n, a.statements[k].n ? numDE(a.statements[k].avg, 2) : '', 'Durchschnitt (1–5)'])); break;
      case 'open': a.answers.forEach(x => rows.push([...base, x.text, 1, '', ''])); break;
      case 'ranking': a.items.forEach((it, r) => rows.push([...base, optLabel(q, it.i), a.n, it.score, `Platz ${r + 1}, Ø Rang ${numDE(it.avgRank, 2)}`])); break;
    }
    if (!a.n) rows.push([...base, '(keine Antworten)', 0, '', '']);
  });
  return '﻿' + rows.map(r => r.map(cell).join(';')).join('\r\n');
}
function resultsJSON(s) {
  return JSON.stringify({
    exportedAt: new Date().toISOString(), title: s.title, code: s.code,
    questions: s.questions.map(({ image, ...q }) => ({
      ...q, hasImage: !!image, results: aggregate(q, s.responses[q.id]),
      responses: (s.responses[q.id] || []).map(r => ({ participant: r.pid, time: new Date(r.t).toISOString(), answer: r.data })),
    })),
  }, null, 2);
}

  /** Bild oder PDF zur Frage hochladen (Klick oder Drag & Drop), Vorschau, Alternativtext, entfernen. */
  function buildImageField(q, id, cur, upd) {
    const fileIn = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp,image/gif,application/pdf,.pdf', id: id + '-img', 'aria-describedby': id + '-imghint' });
    const status = h('span', { 'aria-live': 'polite' });
    const sizeInfo = () => `Bilder werden automatisch verkleinert, PDFs bis ${fmtBytes(MAX_PDF)}. Speicher belegt: ${numDE(store.storageSize() / 1e6)} von ca. 5 MB.`;
    async function handle(file) {
      if (!file) return;
      const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
      status.textContent = isPdf ? 'PDF wird geladen …' : 'Bild wird verarbeitet …';
      try {
        let patch;
        if (isPdf) {
          const d = await processPdf(file);
          const put = store.putFile(d);
          if (put.error) throw new Error(put.error);
          patch = { pdf: { id: put.id, name: file.name, type: 'application/pdf', size: file.size }, image: '', imageAlt: '' };
        } else {
          patch = { image: await compressImage(file), imageAlt: cur().pdf ? '' : cur().imageAlt, pdf: null };
        }
        forceForm = true; focusAfterBuild = isPdf ? null : 'img-alt';
        const r = upd(patch);
        if (r?.error) { forceForm = false; focusAfterBuild = null; status.textContent = ''; toast(r.error); }
        else toast(isPdf ? 'PDF hinzugefügt' : 'Bild hinzugefügt');
      } catch (err) { status.textContent = ''; toast(err.message); }
    }
    fileIn.addEventListener('change', () => { handle(fileIn.files[0]); fileIn.value = ''; });
    const replaceBtn = () => h('label', { class: 'btn small', for: id + '-img', tabindex: 0, role: 'button', onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileIn.click(); } } }, '🔄 Ersetzen');
    const field = h('div', { class: 'field' }, h('span', { class: 'label' }, 'Bild oder PDF (optional)'));
    if (q.pdf) {
      field.append(h('div', { class: 'img-edit' },
        h('div', { class: 'pdf-thumb', 'aria-hidden': 'true' }, '📄'),
        h('div', {},
          h('span', { class: 'media-name' }, q.pdf.name), h('span', { class: 'hint' }, ` · ${fmtBytes(q.pdf.size)}`),
          h('p', { class: 'hint' }, 'Erscheint auf der Folie neben den Ergebnissen und auf den Handys der Teilnehmenden.'),
          h('div', { class: 'row' },
            h('button', { class: 'btn small', type: 'button', onclick: () => openPdfOverlay(q.pdf) }, '👁 Ansehen'),
            replaceBtn(),
            h('button', { class: 'btn small danger', type: 'button', onclick: () => { forceForm = true; upd({ pdf: null }); toast('PDF entfernt'); } }, '✕ Entfernen'),
            status))),
        h('span', { hidden: true }, fileIn),
        h('p', { class: 'hint', id: id + '-imghint' }, sizeInfo()));
    } else if (q.image) {
      const alt = h('input', { class: 'input img-alt', id: id + '-alt', maxlength: 150, value: q.imageAlt, placeholder: 'Kurz beschreiben, was zu sehen ist', oninput: e => upd({ imageAlt: e.target.value }) });
      field.append(h('div', { class: 'img-edit' },
        h('img', { src: q.image, alt: 'Vorschau des Fragenbilds' }),
        h('div', {},
          h('label', { class: 'label', for: id + '-alt' }, 'Bildbeschreibung (für Screenreader)'), alt,
          h('div', { class: 'row' },
            replaceBtn(),
            h('button', { class: 'btn small danger', type: 'button', onclick: () => { forceForm = true; upd({ image: '', imageAlt: '' }); toast('Bild entfernt'); } }, '✕ Entfernen'),
            status))),
        h('span', { hidden: true }, fileIn),
        h('p', { class: 'hint', id: id + '-imghint' }, sizeInfo()));
    } else {
      const zone = h('label', { class: 'dropzone', for: id + '-img' },
        h('span', { class: 'big', 'aria-hidden': 'true' }, '🖼️'),
        h('span', {}, 'Bild oder PDF hochladen – klicken oder hierher ziehen'),
        h('span', { class: 'hint' }, 'JPG, PNG, WebP, GIF oder PDF'), fileIn, status);
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('over'));
      zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('over'); handle(e.dataTransfer.files[0]); });
      field.append(zone, h('p', { class: 'hint', id: id + '-imghint' }, sizeInfo()));
    }
    return field;
  }

  /** Dateien anhängen (Klick oder Drag & Drop), auflisten, herunterladen, entfernen. */
  function buildFilesField(q, id, cur, upd) {
    const fileIn = h('input', { type: 'file', id: id + '-files', multiple: true, accept: FILE_EXT.map(x => '.' + x).join(','), 'aria-describedby': id + '-fileshint' });
    async function handle(list) {
      for (const f of list) {
        if (cur().files.length >= MAX_FILES) { toast(`Maximal ${MAX_FILES} Dateien pro Frage.`); break; }
        try {
          const d = await processFile(f);
          const r = store.putFile(d);
          if (r.error) throw new Error(r.error);
          forceForm = true;
          const u = upd({ files: [...cur().files, { id: r.id, name: f.name, type: f.type || 'application/octet-stream', size: f.size }] });
          if (u?.error) throw new Error(u.error);
          toast(`„${f.name}“ angehängt`);
        } catch (err) { toast(`${f.name}: ${err.message}`); }
      }
    }
    fileIn.addEventListener('change', () => { const list = [...fileIn.files]; fileIn.value = ''; handle(list); });
    const field = h('div', { class: 'field' }, h('span', { class: 'label' }, `Dateien zum Herunterladen (optional, bis zu ${MAX_FILES})`));
    if (q.files.length) {
      field.append(h('ul', { class: 'file-list', 'aria-label': 'Angehängte Dateien' }, q.files.map((f, i) => h('li', {},
        h('span', { 'aria-hidden': 'true' }, '📎'),
        h('button', { class: 'link-btn', type: 'button', title: 'Herunterladen', onclick: () => downloadAttachment(f) }, f.name),
        h('span', { class: 'hint' }, fmtBytes(f.size)),
        h('button', { class: 'btn icon-btn ghost small', type: 'button', 'aria-label': `${f.name} entfernen`,
          onclick: () => { forceForm = true; upd({ files: cur().files.filter((_, k) => k !== i) }); toast('Datei entfernt'); } }, '✕')))));
    }
    if (q.files.length < MAX_FILES) {
      const zone = h('label', { class: 'dropzone compact', for: id + '-files' },
        h('span', { class: 'big', 'aria-hidden': 'true' }, '📎'),
        h('span', {}, 'Datei anhängen – klicken oder hierher ziehen'), fileIn);
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('over'));
      zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('over'); handle([...e.dataTransfer.files]); });
      field.append(zone);
    } else field.append(h('span', { hidden: true }, fileIn));
    field.append(h('p', { class: 'hint', id: id + '-fileshint' }, `PDF, Word, PowerPoint, Excel, Text, ZIP … · max. ${fmtBytes(MAX_FILE)} pro Datei. Teilnehmende können die Dateien auf dem Handy herunterladen.`));
    return field;
  }

  function syncForm(q) {
    if (!q || !refs) return;
    refs.lockCb.checked = q.locked; refs.hideCb.checked = q.hidden;
    const isLive = store.currentQuestion()?.id === q.id;
    refs.liveBtn.disabled = isLive;
    refs.liveBtn.textContent = isLive ? '● Ist live' : '● Live schalten';
  }

  async function onImport(e) {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    if (f.size > 25e6) { toast('Datei ist zu groß (max. 25 MB).'); return; }
    try {
      const obj = JSON.parse(await f.text());
      if (!confirm('Der Import ersetzt die aktuelle Präsentation inklusive aller Ergebnisse. Fortfahren?')) return;
      store.importPresentation(obj);
      selected = store.getState().questions[0]?.id; forceForm = true; render();
      toast('Präsentation importiert');
    } catch (err) { toast('Import fehlgeschlagen: ' + err.message); }
  }

  render();
  const off = store.subscribe((_, kind) => { if (kind === 'state') render(); });
  return () => off();
}

/* ---------- 6b. Präsentation ---------- */
function mountPresent(root) {
  const cur = () => store.currentQuestion();
  const urlEl = h('span', { class: 'url' }), codeEl = h('span', { class: 'code' }), peopleEl = h('span');
  const qrBtn = h('button', { class: 'qr-btn', type: 'button', 'aria-label': 'QR-Code vergrößern (Taste Q)', title: 'QR-Code vergrößern (Q)', onclick: showQR });
  const joinbar = h('header', { class: 'joinbar' }, logo(),
    h('div', { class: 'join-center' }, qrBtn, h('div', { class: 'join-text' }, h('span', {}, 'Abstimmen unter'), urlEl, h('span', {}, 'mit dem Code'), codeEl)),
    h('span', { class: 'pill', title: 'Aktive Teilnehmende', 'aria-live': 'polite' }, h('span', { 'aria-hidden': 'true' }, '👥'), peopleEl));
  const main = h('main', { class: 'present-main' });
  const sv = createSlideView(main, { live: true });

  const btn = (label, onclick, extra = {}) => h('button', { class: 'btn', type: 'button', onclick, ...extra }, label);
  const prevBtn = btn('◀', () => store.setCurrent(store.getState().current - 1), { 'aria-label': 'Vorherige Folie' });
  const nextBtn = btn('▶', () => store.setCurrent(store.getState().current + 1), { 'aria-label': 'Nächste Folie' });
  const counter = h('span', { class: 'counter', 'aria-live': 'polite' });
  const hideBtn = btn('', () => toggle('hidden'), { title: 'Taste H' });
  const lockBtn = btn('', () => toggle('locked'), { title: 'Taste L' });
  const quizBtn = h('button', { class: 'btn primary', type: 'button', onclick: quizAction });
  const resetBtn = h('button', { class: 'btn danger', type: 'button', onclick: () => { const q = cur(); if (q && confirm('Ergebnisse dieser Frage zurücksetzen?')) store.resetResults(q.id); } }, '↺ Zurücksetzen');
  const fsBtn = btn('⛶ Vollbild', toggleFS, { title: 'Taste F' });
  const controls = h('nav', { class: 'controls', 'aria-label': 'Präsentationssteuerung' },
    prevBtn, counter, nextBtn, h('span', { class: 'sep', 'aria-hidden': 'true' }),
    quizBtn, hideBtn, lockBtn, resetBtn, fsBtn, themeButton(), h('a', { class: 'btn ghost', href: '#edit' }, '✎ Editor'));
  const wrap = h('div', { class: 'present' }, joinbar, main, controls);
  root.replaceChildren(wrap);

  function toggle(key) { const q = cur(); if (q) store.updateQuestion(q.id, { [key]: !q[key] }); }
  function quizAction() {
    const q = cur(); if (!q || q.type !== 'quiz') return;
    const ph = quizPhase(q, store.getState());
    if (ph === 'idle') store.startQuiz(q.id);
    else if (ph === 'running') store.revealQuiz(q.id);
    else if (confirm('Quiz neu starten? Bisherige Antworten werden gelöscht.')) store.startQuiz(q.id);
  }
  function toggleFS() {
    if (document.fullscreenElement) document.exitFullscreen?.();
    else document.documentElement.requestFullscreen?.().catch(() => toast('Vollbild nicht verfügbar'));
  }

  let lastCode = null;
  function update() {
    const s = store.getState(), q = cur();
    if (s.code + '|' + s.joinBase !== lastCode) {
      lastCode = s.code + '|' + s.joinBase;
      urlEl.textContent = joinBaseUrl() + '#vote'; urlEl.title = joinBaseUrl() + '#vote';
      codeEl.textContent = fmtCode(s.code);
      qrBtn.replaceChildren(QR.svg(joinUrl(s.code)) || h('span', {}, 'QR'));
    }
    sv.render(s, q);
    counter.textContent = s.questions.length ? `${s.current + 1} / ${s.questions.length}` : '0 / 0';
    prevBtn.disabled = s.current <= 0;
    nextBtn.disabled = s.current >= s.questions.length - 1;
    hideBtn.setAttribute('aria-pressed', String(!!q?.hidden));
    hideBtn.textContent = q?.hidden ? '👁 Ergebnisse zeigen' : '🙈 Ergebnisse verbergen';
    lockBtn.setAttribute('aria-pressed', String(!!q?.locked));
    lockBtn.textContent = q?.locked ? '🔓 Abstimmung öffnen' : '🔒 Abstimmung sperren';
    [hideBtn, lockBtn, resetBtn].forEach(b => { b.disabled = !q; });
    quizBtn.hidden = q?.type !== 'quiz';
    if (q?.type === 'quiz') {
      const ph = quizPhase(q, s);
      const label = ph === 'idle' ? '▶ Quiz starten' : ph === 'running' ? '⏭ Jetzt auflösen' : '↻ Quiz neu starten';
      if (quizBtn.textContent !== label) quizBtn.textContent = label;
    }
    updatePeople();
  }
  function updatePeople() { const n = store.participantCount(); peopleEl.textContent = String(n); peopleEl.parentElement.setAttribute('aria-label', plural(n, 'aktive Person', 'aktive Personen')); }

  let overlay = null;
  /** Große Beitrittsansicht: QR-Code, Adresse und Code – erscheint automatisch zu Beginn. */
  function showQR() {
    if (overlay) return;
    const s = store.getState(), url = joinUrl(s.code);
    const close = h('button', { class: 'btn primary', type: 'button', onclick: closeQR }, 'Los geht’s ▶');
    const warn = isLocalUrl(url) ? h('p', { class: 'join-warn', role: 'note' },
      h('strong', {}, '⚠️ Dieser QR-Code funktioniert noch nicht auf Handys. '),
      'Das Tool läuft gerade als Datei auf diesem Computer. Lege die Datei auf einen Webserver und trage im Editor unter „Teilnahme per Handy“ ihre Adresse ein.') : null;
    overlay = h('div', { class: 'overlay', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'So nimmst du teil', onclick: e => { if (e.target === overlay) closeQR(); } },
      h('div', { class: 'overlay-card join-screen' },
        h('h2', {}, 'Mach mit! 📱'),
        h('div', { class: 'join-grid' },
          QR.svg(url) || h('p', {}, 'Die Adresse ist zu lang für einen QR-Code.'),
          h('div', { class: 'join-steps' },
            h('ol', {},
              h('li', {}, 'QR-Code mit der Handy-Kamera scannen'),
              h('li', {}, 'oder öffnen: ', h('span', { class: 'join-url' }, joinBaseUrl() + '#vote')),
              h('li', {}, 'Code eingeben:', h('span', { class: 'big-code' }, fmtCode(s.code)))))),
        warn, close));
    document.body.append(overlay); close.focus();
  }
  function closeQR() { if (!overlay) return; overlay.remove(); overlay = null; qrBtn.focus(); }

  function onKey(e) {
    if (e.key === 'Escape' && overlay) { closeQR(); return; }
    if (isTyping(e) || e.altKey || e.ctrlKey || e.metaKey || overlay || document.querySelector('.overlay')) return;
    if (e.key === ' ' && e.target.closest?.('button,a,summary')) return;
    const s = store.getState();
    switch (e.key) {
      case 'ArrowRight': case 'PageDown': case ' ': store.setCurrent(s.current + 1); break;
      case 'ArrowLeft': case 'PageUp': store.setCurrent(s.current - 1); break;
      case 'f': case 'F': toggleFS(); break;
      case 'h': case 'H': toggle('hidden'); break;
      case 'l': case 'L': toggle('locked'); break;
      case 'q': case 'Q': showQR(); break;
      default: return;
    }
    e.preventDefault();
  }
  // Steuerleiste im Vollbild nach Inaktivität ausblenden
  let idleTimer;
  function onMove() {
    wrap.classList.remove('idle'); clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (document.fullscreenElement && !controls.matches(':focus-within')) wrap.classList.add('idle'); }, 2500);
  }

  update();
  showQR(); // Beitrittsansicht groß zu Beginn – schließen mit „Los geht’s“, Esc oder Klick daneben
  const off = store.subscribe((_, kind) => (kind === 'presence' ? updatePeople() : update()));
  const tick = setInterval(() => { if (cur()?.type === 'quiz') update(); }, 250);
  const peopleTick = setInterval(updatePeople, 5000);
  addEventListener('keydown', onKey);
  addEventListener('mousemove', onMove);
  document.addEventListener('fullscreenchange', onMove);
  return () => {
    off(); clearInterval(tick); clearInterval(peopleTick); clearTimeout(idleTimer); closeQR();
    removeEventListener('keydown', onKey); removeEventListener('mousemove', onMove); document.removeEventListener('fullscreenchange', onMove);
  };
}

/* ---------- 6c. Teilnehmer ---------- */
/* Teilnehmer-ID: Für die Demo pro Tab (sessionStorage), damit mehrere Tabs als
   verschiedene Personen abstimmen können. In Produktion localStorage/Cookie
   oder anonyme Authentifizierung (z. B. Firebase Anonymous Auth) verwenden. */
const PID_KEY = 'mentiLite:pid', JOIN_KEY = 'mentiLite:joined';
function getPid() {
  let p = SS.getItem(PID_KEY);
  if (!p) { p = 'p-' + uid(); SS.setItem(PID_KEY, p); }
  return p;
}

function mountVote(root, arg) {
  const pid = getPid();
  if (arg && arg.replace(/\D/g, '') === store.getState().code) SS.setItem(JOIN_KEY, store.getState().code);
  const joined = () => SS.getItem(JOIN_KEY) === store.getState().code;

  const codeLabel = h('span', { class: 'pill' });
  const headLogo = logo();
  const leaveBtn = h('button', { class: 'btn small ghost', type: 'button', onclick: leave }, 'Verlassen');
  const main = h('main', { class: 'vote-main' });
  root.replaceChildren(h('div', { class: 'vote' },
    h('header', { class: 'vote-head' }, headLogo, IN_PREVIEW ? h('a', { class: 'btn small ghost', href: '#edit' }, '← Editor') : null, h('div', { class: 'spacer' }), codeLabel, leaveBtn, themeButton()),
    main));

  let sig = null, countdown = null;

  function render() {
    const s = store.getState(), isJoined = joined();
    codeLabel.hidden = leaveBtn.hidden = headLogo.hidden = !isJoined;
    codeLabel.textContent = '# ' + fmtCode(s.code);
    if (!isJoined) { if (sig !== 'join') { sig = 'join'; renderJoin(); } return; }
    const q = store.currentQuestion(s);
    const phase = q?.type === 'quiz' ? quizPhase(q, s) : '';
    const voted = q ? store.hasVoted(q.id, pid, s) : false;
    // Nur neu aufbauen, wenn sich für diese Person etwas Relevantes ändert –
    // so wird ein halb ausgefülltes Formular nicht durch fremde Stimmen gelöscht.
    const nsig = JSON.stringify([q?.id, q?.type, q?.title, q?.options, q?.statements, q?.minLabel, q?.maxLabel, q?.locked, phase, voted, q ? imageKey(q) : '', q ? filesKey(q) : '']);
    if (nsig !== sig) { sig = nsig; renderQuestion(s, q, phase, voted); }
    if (countdown && q && countdown.qid === q.id) {
      const left = quizLeftMs(q, s);
      countdown.num.textContent = Math.ceil(left / 1000);
      countdown.ring.style.setProperty('--p', (left / (q.timer * 1000)).toFixed(3));
    }
  }

  function renderJoin() {
    countdown = null;
    const input = h('input', { class: 'input code-input', id: 'join-code', inputmode: 'numeric', autocomplete: 'off', maxlength: 7, placeholder: '123 456', 'aria-describedby': 'join-err' });
    const err = h('p', { class: 'error', id: 'join-err', role: 'alert' });
    main.replaceChildren(h('form', { class: 'join-card', novalidate: true, onsubmit: e => {
      e.preventDefault();
      const c = input.value.replace(/\D/g, '');
      if (c.length !== 6) { err.textContent = 'Bitte gib den 6-stelligen Code ein.'; input.focus(); return; }
      if (c !== store.getState().code) { err.textContent = 'Dieser Code ist ungültig.'; input.select(); return; }
      SS.setItem(JOIN_KEY, c); store.heartbeat(pid); sig = null; render();
    } },
      logo(),
      h('h1', {}, 'Mitmachen'),
      h('label', { for: 'join-code', class: 'label' }, 'Gib den Code ein, den du auf der Leinwand siehst'),
      input, err, h('button', { class: 'btn primary block', type: 'submit' }, 'Teilnehmen')));
    input.focus();
  }

  const screen = (icon, title, text) => h('div', { class: 'thanks' }, h('div', { class: 'big', 'aria-hidden': 'true' }, icon), h('h2', {}, title), text ? h('p', { class: 'hint' }, text) : null);

  function submit(q, data, err) {
    const r = store.vote(q.id, pid, data);
    if (r.error) err.textContent = r.error;
  }

  function renderQuestion(s, q, phase, voted) {
    countdown = null;
    if (!q) { main.replaceChildren(screen('⏳', 'Noch keine Frage', 'Warte, bis die Präsentation startet.')); return; }
    const err = h('p', { class: 'error', role: 'alert' });
    const head = [h('p', { class: 'q-kicker' }, `${TYPES[q.type].icon} ${TYPES[q.type].label}`), h('h1', {}, titleOf(q)),
      q.image ? h('img', { class: 'vote-img', src: q.image, alt: q.imageAlt || '' }) : null,
      q.pdf ? h('div', { class: 'vote-pdf' }, pdfView(q.pdf, { actions: true })) : null];
    // Anhänge bleiben auch nach der Stimmabgabe abrufbar
    const filesBox = () => (q.files.length ? h('div', { class: 'vote-files' }, h('p', { class: 'label' }, 'Material zum Herunterladen'), fileButtons(q)) : null);
    head.push(filesBox());
    const headEls = head.filter(Boolean); // null-Einträge nicht als Text „null“ einfügen
    if (q.type === 'quiz') { main.replaceChildren(...headEls, quizBody(s, q, phase, voted, err)); return; }
    if (voted) { main.replaceChildren(...[screen('🎉', 'Danke für deine Stimme!', 'Die Ergebnisse erscheinen auf der Leinwand. Warte auf die nächste Frage.'), filesBox()].filter(Boolean)); return; }
    if (q.locked) { main.replaceChildren(...headEls, screen('🔒', 'Abstimmung geschlossen', 'Warte auf die nächste Frage.')); return; }
    main.replaceChildren(...headEls, buildVoteForm(q, err));
  }

  function buildVoteForm(q, err) {
    const submitBtn = h('button', { class: 'btn primary block', type: 'submit' }, 'Absenden');
    const f = h('form', { novalidate: true });
    switch (q.type) {
      case 'mc': {
        const name = 'c-' + q.id;
        f.append(h('fieldset', { class: 'plain' }, h('legend', { class: 'sr-only' }, titleOf(q)),
          q.options.map((_, i) => h('label', { class: 'choice', style: { '--tc': color(i) } }, h('input', { type: 'radio', name, value: i }), h('span', {}, optLabel(q, i))))));
        f.addEventListener('submit', e => {
          e.preventDefault();
          const sel = f.querySelector('input:checked');
          if (!sel) { err.textContent = 'Bitte wähle eine Option.'; return; }
          submit(q, { choice: Number(sel.value) }, err);
        });
        break;
      }
      case 'wordcloud': {
        const inputs = [0, 1, 2].map(i => h('input', { class: 'input', maxlength: 25, autocomplete: 'off', placeholder: i ? 'Weiterer Begriff (optional)' : 'Dein Begriff', 'aria-label': `Begriff ${i + 1}`, style: { marginBottom: '.5em' } }));
        f.append(...inputs, h('p', { class: 'hint' }, 'Bis zu 3 Begriffe, je max. 25 Zeichen.'));
        f.addEventListener('submit', e => { e.preventDefault(); submit(q, { words: inputs.map(x => x.value) }, err); });
        break;
      }
      case 'scale': {
        q.statements.forEach((_, i) => f.append(h('fieldset', { class: 'rate-fs' }, h('legend', {}, stmtLabel(q, i)),
          h('div', { class: 'rating' }, [1, 2, 3, 4, 5].map(v => h('label', {}, h('input', { type: 'radio', name: `r-${q.id}-${i}`, value: v, 'aria-label': `${v} von 5` }), h('span', { 'aria-hidden': 'true' }, v)))),
          h('div', { class: 'rate-ends', 'aria-hidden': 'true' }, h('span', {}, `1 = ${q.minLabel || 'Stimme nicht zu'}`), h('span', {}, `5 = ${q.maxLabel || 'Stimme voll zu'}`)))));
        f.addEventListener('submit', e => {
          e.preventDefault();
          const ratings = q.statements.map((_, i) => Number(f.querySelector(`input[name="r-${q.id}-${i}"]:checked`)?.value || 0));
          if (ratings.some(r => !r)) { err.textContent = 'Bitte bewerte alle Aussagen.'; return; }
          submit(q, { ratings }, err);
        });
        break;
      }
      case 'open': {
        const counter = h('p', { class: 'hint char-count', 'aria-live': 'polite' }, '0 / 280');
        const ta = h('textarea', { class: 'input', rows: 4, maxlength: 280, placeholder: 'Deine Antwort …', 'aria-label': 'Deine Antwort', oninput: () => { counter.textContent = `${ta.value.length} / 280`; } });
        f.append(ta, counter);
        f.addEventListener('submit', e => { e.preventDefault(); submit(q, { text: ta.value }, err); });
        break;
      }
      case 'ranking': {
        let order = q.options.map((_, i) => i), dragFrom = null;
        const ol = h('ol', { class: 'rank-vote', 'aria-label': 'Reihenfolge – oben steht das Wichtigste' });
        const status = h('p', { class: 'sr-only', 'aria-live': 'polite' });
        const move = (pos, d) => {
          const np = pos + d;
          if (np < 0 || np >= order.length) return;
          [order[pos], order[np]] = [order[np], order[pos]];
          draw();
          status.textContent = `${optLabel(q, order[np])} ist jetzt auf Platz ${np + 1}.`;
          const btns = ol.children[np].querySelectorAll('button');
          (d < 0 && !btns[0].disabled ? btns[0] : !btns[1].disabled ? btns[1] : btns[0]).focus();
        };
        const draw = () => ol.replaceChildren(...order.map((opt, pos) => h('li', { class: 'rank-item', draggable: 'true', dataset: { pos }, style: { '--tc': color(opt) } },
          h('span', { class: 'rank-num' }, pos + 1), h('span', { class: 'rank-text' }, optLabel(q, opt)),
          h('button', { class: 'btn icon-btn ghost small', type: 'button', 'aria-label': `${optLabel(q, opt)} nach oben`, disabled: pos === 0, onclick: () => move(pos, -1) }, '↑'),
          h('button', { class: 'btn icon-btn ghost small', type: 'button', 'aria-label': `${optLabel(q, opt)} nach unten`, disabled: pos === order.length - 1, onclick: () => move(pos, 1) }, '↓'))));
        ol.addEventListener('dragstart', e => { const li = e.target.closest('li'); if (!li) return; dragFrom = Number(li.dataset.pos); li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ''); });
        ol.addEventListener('dragover', e => e.preventDefault());
        ol.addEventListener('drop', e => {
          e.preventDefault();
          const li = e.target.closest('li'); if (!li || dragFrom == null) return;
          const [it] = order.splice(dragFrom, 1); order.splice(Number(li.dataset.pos), 0, it); dragFrom = null; draw();
        });
        ol.addEventListener('dragend', () => { dragFrom = null; ol.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); });
        draw();
        f.append(h('p', { class: 'hint' }, 'Sortiere mit den Pfeilen (oder per Drag & Drop). Oben = am wichtigsten.'), ol, status);
        f.addEventListener('submit', e => { e.preventDefault(); submit(q, { order }, err); });
        break;
      }
    }
    f.append(err, submitBtn);
    return f;
  }

  function quizBody(s, q, phase, voted, err) {
    if (phase === 'idle') return screen('⏳', 'Gleich geht’s los', 'Das Quiz startet in Kürze – halte dich bereit!');
    if (phase === 'running') {
      const num = h('b'), ring = h('div', { class: 'countdown', role: 'timer', 'aria-label': 'Verbleibende Sekunden' }, h('span', {}, num));
      countdown = { num, ring, qid: q.id };
      if (voted) return h('div', { class: 'quiz-vote' }, ring, screen('✅', 'Antwort gespeichert', 'Warte auf die Auflösung …'));
      if (q.locked) return h('div', { class: 'quiz-vote' }, ring, screen('🔒', 'Abstimmung geschlossen', 'Warte auf die Auflösung …'));
      return h('div', { class: 'quiz-vote' }, ring,
        h('div', { class: 'quiz-grid', role: 'group', 'aria-label': 'Antwortmöglichkeiten' }, q.options.map((_, i) =>
          h('button', { class: 'choice quiz-choice', type: 'button', style: { '--tc': color(i) }, onclick: () => submit(q, { choice: i }, err) },
            h('span', { class: 'shape', 'aria-hidden': 'true' }, SHAPES[i]), h('span', {}, optLabel(q, i))))), err);
    }
    const mine = store.myResponse(q.id, pid, s);
    const ok = mine && mine.data.choice === q.correct;
    return screen(!mine ? '⌛' : ok ? '🎉' : '😕', !mine ? 'Keine Antwort abgegeben' : ok ? 'Richtig!' : 'Leider falsch', `Richtige Antwort: ${optLabel(q, q.correct)}`);
  }

  function leave() {
    SS.removeItem(JOIN_KEY); store.leave(pid);
    if (location.hash !== '#vote') history.replaceState(null, '', '#vote');
    sig = null; render();
  }

  render();
  const off = store.subscribe((_, kind) => { if (kind === 'state') render(); });
  const tick = setInterval(render, 250);                       // Countdown & Phasenwechsel
  const beat = () => { if (joined()) store.heartbeat(pid); };
  beat();
  const beatTimer = setInterval(beat, 5000);
  const onHide = () => store.leave(pid);
  addEventListener('pagehide', onHide);
  return () => { off(); clearInterval(tick); clearInterval(beatTimer); removeEventListener('pagehide', onHide); };
}

/* ==================== 7. Router & Start ==================== */
const VIEWS = { edit: mountEditor, present: mountPresent, vote: mountVote };
const VIEW_TITLES = { edit: 'Editor', present: 'Präsentation', vote: 'Abstimmen' };
let cleanup = null;
function route() {
  cleanup?.(); cleanup = null;
  const [name, arg] = location.hash.replace(/^#\/?/, '').split('/');
  const view = hasOwn(VIEWS, name) ? name : 'edit';
  const root = document.getElementById('app');
  root.className = 'view-' + view;
  document.title = `${VIEW_TITLES[view]} – Live-Abstimmung Seminar Heidelberg`;
  cleanup = VIEWS[view](root, arg) || null;
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
// Formulare selbst auslösen (Klick auf Absenden / Enter), ohne echtes Absenden:
// So funktionieren Code-Eingabe und Abstimmen auch in Vorschauen, die Formulare sperren.
const fireSubmit = form => form.dispatchEvent(new Event('submit', { cancelable: true }));
document.addEventListener('click', e => {
  const btn = e.target.closest?.('form button[type="submit"]');
  if (!btn || !btn.form) return;
  e.preventDefault();
  fireSubmit(btn.form);
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key !== 'Enter' || e.isComposing || t.tagName !== 'INPUT' || !t.form) return;
  if (['button', 'submit', 'checkbox', 'radio', 'file', 'reset'].includes(t.type)) return;
  e.preventDefault();
  fireSubmit(t.form);
});
// Interne Links (#edit, #present, #vote) selbst behandeln: In manchen Vorschauen
// (iframe mit srcdoc) würden sie sonst auf eine fremde Seite statt auf die Ansicht zeigen.
document.addEventListener('click', e => {
  const a = e.target.closest?.('a[href^="#"]');
  if (!a || a.target || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
  e.preventDefault();
  if (location.hash !== a.getAttribute('href')) location.hash = a.getAttribute('href');
});
addEventListener('storage', e => { if (e.key === theme.KEY) theme.apply(); });
theme.apply();
route();
</script>
